# Push-to-deploy for kiosk/ -- the BowlerDepot in-store kiosk app (runbook
# 6eh), kiosk.bowlerdepot.com. Same shape as deploy-learn-site.yml (OIDC
# role, no AWS keys in the repo, hashed assets cached for a year, everything
# else no-cache), minus Learn's prerender and slug-redirect steps.
#
# Repo variables: KIOSK_SITE_BUCKET, KIOSK_SITE_DISTRIBUTION_ID,
# KIOSK_SITE_DEPLOY_ROLE_ARN (template.yaml outputs), plus the existing
# PUBLIC_API_URL and AWS_REGION. Optional repo secret KIOSK_CONFIG_PIN sets
# the hidden config screen's PIN (the app falls back to a default).
name: Deploy kiosk site

on:
  push:
    branches: [main]
    paths:
      - "kiosk/**"
      - ".github/workflows/deploy-kiosk-site.yml"
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-kiosk-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kiosk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: kiosk/package-lock.json

      - run: npm ci

      - name: Build
        env:
          VITE_PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
          VITE_KIOSK_CONFIG_PIN: ${{ secrets.KIOSK_CONFIG_PIN }}
        run: VITE_BUILD_TIME="$(date -u +%Y-%m-%dT%H:%MZ) ${GITHUB_SHA::7}" npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.KIOSK_SITE_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-skip-session-tagging: true

      - name: Sync to S3
        run: |
          aws s3 sync dist/ "s3://${{ vars.KIOSK_SITE_BUCKET }}/" \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*" --include "assets/*"
          aws s3 sync dist/ "s3://${{ vars.KIOSK_SITE_BUCKET }}/" --delete \
            --cache-control "no-cache" \
            --exclude "assets/*"

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.KIOSK_SITE_DISTRIBUTION_ID }}" --paths "/*"
