AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Bowling ball scraper/database. Sitemap-driven URL discovery, per-manufacturer
  HTML + PDF product scraping, image mirroring/normalization, and an admin
  approval API sitting in front of a shared Postgres schema.

  This template wires up all five functions from the architecture doc's
  build order, chained end to end via SQS: UrlDiscoveryFunction (scheduled)
  publishes new/changed URLs to ProductScrapeQueue; ProductScraperFunction
  consumes that queue and, per product, publishes to PdfParseQueue (when an
  info_sheet_url was found) and ImageProcessQueue (one job per image still
  missing stored_url); PdfParserFunction and ImageProcessorFunction consume
  those. AdminApiFunction sits apart from the chain as a real HTTP API.
  SQS was chosen over Step Functions for this fan-out -- see the comment in
  src/url_discovery/app.py for why: simpler for a straight-line pipeline
  with no branching, revisit if that changes. Each queue has a
  dead-letter queue and the consuming functions use Lambda's partial batch
  response feature (ReportBatchItemFailures) so one bad message doesn't
  fail an entire batch.

Globals:
  Function:
    Runtime: python3.13
    Timeout: 60
    MemorySize: 256
    Environment:
      Variables:
        DB_SECRET_ARN: !Ref DbSecretArn
        POWERTOOLS_SERVICE_NAME: bowling-scraper

Parameters:
  DbSecretArn:
    Type: String
    Description: >
      ARN of a Secrets Manager secret holding {host, port, dbname, username,
      password} for the Postgres instance. Not created by this template --
      point it at your existing RDS instance/secret once you provision one.
  SitemapUrl:
    Type: String
    Default: https://brunswickbowling.com/sitemaps-1-section-bowlerProducts-1-sitemap.xml
    Description: >
      Per-brand product sitemap. Brunswick, Radical, and DV8 share the same
      Craft CMS template and URL shape, so this same function/handler can be
      reused for all three by deploying a second stack (or a second
      EventBridge-triggered invocation) with this parameter pointed at the
      sister brand's sitemap instead of duplicating code.
  UrlPathPattern:
    Type: String
    Default: /products/balls/(current|retired)/
    Description: Regex matched against sitemap <loc> paths to keep only ball product pages.
  BrandId:
    Type: String
    Description: >
      UUID of the row in the `brands` table this deployment discovers URLs
      for (see db/migrations/001_init_schema.sql). Insert the brand row via
      the migration/seed data before deploying, then pass its id here.
  SwagCategoryUrl:
    Type: String
    Default: https://www.swagbowling.com/shop/bowling-balls/
    Description: >
      WooCommerce category archive URL WooCommerceUrlDiscoveryFunction
      paginates through to find ball product URLs (SWAG's flat product
      sitemap mixes balls with apparel/accessories, so this is the actual
      filtering mechanism -- see src/woocommerce_url_discovery/app.py).
  SwagSitemapUrl:
    Type: String
    Default: https://www.swagbowling.com/product-sitemap.xml
    Description: Yoast SEO product sitemap, used only for its per-URL <lastmod> values.
  SwagBrandId:
    Type: String
    Default: ""
    Description: >
      UUID of the `brands` row for SWAG Bowling. Left blank by default so
      this template still deploys standalone for just the Craft-CMS family
      (BrandId above) without requiring a second brand row up front --
      required once you actually enable the WooCommerce functions.
  MotivCurrentCategoryUrl:
    Type: String
    Default: https://www.motivbowling.com/products/balls/
    Description: >
      NetSuite catalog index page NetsuiteUrlDiscoveryFunction reads for
      currently-for-sale balls -- confirmed real, single-page (no
      pagination), all product links present as plain <a href="/n_<id>">
      tags -- see src/netsuite_url_discovery/app.py.
  MotivRetiredCategoryUrl:
    Type: String
    Default: https://www.motivbowling.com/products/balls/retired-balls/
    Description: Same as MotivCurrentCategoryUrl but for the retired-balls index (202 links as of this session).
  MotivBrandId:
    Type: String
    Default: ""
    Description: >
      UUID of the `brands` row for MOTIV Bowling. Left blank by default,
      same reasoning as SwagBrandId -- required once you actually enable
      the NetSuite functions.

Resources:
  ImageBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub bowling-scraper-images-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      # Public-read is intentional -- these are the normalized product
      # images the consumer site serves directly by URL (stored_url in
      # product_images), not internal working data. Revisit if serving
      # through CloudFront instead of raw S3 URLs later.

  ImageBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ImageBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub arn:aws:s3:::${ImageBucket}/*

  # --- Orchestration queues ---
  #
  # One queue + DLQ per hand-off in the pipeline. VisibilityTimeout is 6x
  # the consuming function's Timeout (30s), the multiplier AWS recommends
  # for SQS-Lambda so a message isn't picked up again mid-processing before
  # the function has had a chance to finish and delete it. maxReceiveCount
  # of 3 on each DLQ redrive policy: fail three times (including transient
  # errors), then stop retrying and let a human look at the DLQ rather than
  # retrying forever.

  ProductScrapeDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: bowling-scraper-product-scrape-dlq

  ProductScrapeQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: bowling-scraper-product-scrape
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ProductScrapeDLQ.Arn
        maxReceiveCount: 3

  PdfParseDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: bowling-scraper-pdf-parse-dlq

  PdfParseQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: bowling-scraper-pdf-parse
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt PdfParseDLQ.Arn
        maxReceiveCount: 3

  ImageProcessDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: bowling-scraper-image-process-dlq

  ImageProcessQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: bowling-scraper-image-process
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ImageProcessDLQ.Arn
        maxReceiveCount: 3

  # Separate scrape queues per platform family, not a shared
  # ProductScrapeQueue -- each platform's product scraper Lambda expects a
  # different job shape and calls entirely different parsing code, so
  # they can't share one consumer the way PDF parsing and image
  # processing can (those two ARE platform-agnostic, hence the shared
  # ImageProcessQueue below). Same VisibilityTimeout/maxReceiveCount
  # convention as every other queue pair in this template.

  WooCommerceProductScrapeDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: bowling-scraper-woocommerce-product-scrape-dlq

  WooCommerceProductScrapeQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: bowling-scraper-woocommerce-product-scrape
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt WooCommerceProductScrapeDLQ.Arn
        maxReceiveCount: 3

  NetsuiteProductScrapeDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: bowling-scraper-netsuite-product-scrape-dlq

  NetsuiteProductScrapeQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: bowling-scraper-netsuite-product-scrape
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt NetsuiteProductScrapeDLQ.Arn
        maxReceiveCount: 3

  UrlDiscoveryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: bowling-scraper-url-discovery
      CodeUri: src/url_discovery/
      Handler: app.handler
      Environment:
        Variables:
          SITEMAP_URL: !Ref SitemapUrl
          URL_PATH_PATTERN: !Ref UrlPathPattern
          BRAND_ID: !Ref BrandId
          PRODUCT_SCRAPE_QUEUE_URL: !Ref ProductScrapeQueue
      Policies:
        - VPCAccessPolicy: {}
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref DbSecretArn
        - SQSSendMessagePolicy:
            QueueName: !GetAtt ProductScrapeQueue.QueueName
      Events:
        DailySchedule:
          Type: Schedule
          Properties:
            # Daily is a starting point, not a hard requirement -- the
            # architecture doc recommends triggering off sitemap <lastmod>
            # rather than a blind full re-crawl once this is proven out.
            Schedule: rate(1 day)
            Name: bowling-scraper-url-discovery-daily
            Description: Sitemap diff against discovered_urls; emits new/changed product URLs.
            Enabled: true

  ProductScraperFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: bowling-scraper-product-scraper
      CodeUri: src/product_scraper/
      Handler: app.handler
      Timeout: 30
      Environment:
        Variables:
          PDF_PARSE_QUEUE_URL: !Ref PdfParseQueue
          IMAGE_PROCESS_QUEUE_URL: !Ref ImageProcessQueue
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref DbSecretArn
        - SQSSendMessagePolicy:
            QueueName: !GetAtt PdfParseQueue.QueueName
        - SQSSendMessagePolicy:
            QueueName: !GetAtt ImageProcessQueue.QueueName
      Events:
        ProductScrapeQueueTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt ProductScrapeQueue.Arn
            BatchSize: 5
            FunctionResponseTypes:
              - ReportBatchItemFailures
      # SQS-triggered from ProductScrapeQueue (populated by
      # UrlDiscoveryFunction) -- also still accepts direct/manual
      # invocation with {"url": "...", "brand_id": "..."}, see
      # src/product_scraper/app.py's _extract_jobs.
      #
      # Only handles the Craft-CMS family (Brunswick/Radical/DV8) -- same
      # reasoning as UrlDiscoveryFunction re: reuse across those three brands.
      # Shopify family (Hammer/Ebonite/Track): pull {handle}.json directly,
      # no HTML parsing at all, needs its own function.

  PdfParserFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: bowling-scraper-pdf-parser
      CodeUri: src/pdf_parser/
      Handler: app.handler
      Timeout: 30
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref DbSecretArn
      Events:
        PdfParseQueueTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt PdfParseQueue.Arn
            BatchSize: 5
            FunctionResponseTypes:
              - ReportBatchItemFailures
      # SQS-triggered from PdfParseQueue (populated by ProductScraperFunction
      # whenever a scraped page had an info_sheet_url) -- also still accepts
      # direct/manual invocation with {"info_sheet_url": "...",
      # "product_id": "..."}. Independently-failing from the HTML step on
      # purpose: a PDF-parsing miss shouldn't block the HTML-derived fields
      # already saved (they're two separate queues/functions, not one
      # invocation doing both).

  ImageProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: bowling-scraper-image-processor
      CodeUri: src/image_processor/
      Handler: app.handler
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          IMAGE_BUCKET: !Ref ImageBucket
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref DbSecretArn
        - S3CrudPolicy:
            BucketName: !Ref ImageBucket
      Events:
        ImageProcessQueueTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt ImageProcessQueue.Arn
            BatchSize: 5
            FunctionResponseTypes:
              - ReportBatchItemFailures
      # SQS-triggered from ImageProcessQueue (populated by
      # ProductScraperFunction for any product_images row still missing
      # stored_url) -- also still accepts direct/manual invocation with
      # {"product_image_id": "...", "source_url": "..."}.

  AdminApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: bowling-scraper-admin-api
      CodeUri: src/admin_api/
      Handler: app.handler
      Timeout: 15
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref DbSecretArn
      Events:
        AdminApi:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
      # FastAPI + Mangum, per the architecture doc's decided workflow:
      # review everything on the initial catalog load, then steady-state
      # auto-approve except mismatched fields written to review_queue.
      # No auth wired up here -- this is a bare HTTP API with no
      # authorizer, fine for testing but NOT for a real deployment.
      # Put an authorizer (Cognito, IAM, or even a shared-secret Lambda
      # authorizer) in front before this is reachable from outside a VPN/
      # trusted network -- deliberately not guessed at here since it's a
      # real security decision, not a default to assume.

  # --- WooCommerce brand family (SWAG Bowling to start) ---
  #
  # A genuinely different platform from everything above, added this
  # session -- see src/woocommerce_url_discovery/app.py and
  # woocommerce_product_scraper/app.py module docstrings for the real,
  # confirmed platform differences that drove their design (no per-weight
  # RG/DIFF table, mass bias already in HTML unlike Brunswick, category-
  # page-based discovery instead of sitemap-path filtering).
  #
  # Bundled into this same template/stack rather than a separate one, for
  # now -- consistent with how this template already covers multiple
  # Craft-CMS brands via redeploys with different parameters, just now
  # with a second platform's functions too. Worth reconsidering (separate
  # template/nested stack per platform family) once there's a third
  # platform or this file gets unwieldy -- not a problem yet with two.
  #
  # Now wired into their own SQS chain -- WooCommerceUrlDiscoveryFunction
  # publishes to WooCommerceProductScrapeQueue,
  # WooCommerceProductScraperFunction consumes it and fans out to the
  # shared ImageProcessQueue for any new images. Not a PDF-parser trigger
  # target: SWAG's HTML already carries RG/DIFF/mass-bias-when-present
  # directly, so PdfParseQueue doesn't apply to this brand the way it does
  # to Brunswick.

  WooCommerceUrlDiscoveryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: bowling-scraper-woocommerce-url-discovery
      CodeUri: src/woocommerce_url_discovery/
      Handler: app.handler
      Environment:
        Variables:
          CATEGORY_URL: !Ref SwagCategoryUrl
          SITEMAP_URL: !Ref SwagSitemapUrl
          BRAND_ID: !Ref SwagBrandId
          PRODUCT_SCRAPE_QUEUE_URL: !Ref WooCommerceProductScrapeQueue
      Policies:
        - VPCAccessPolicy: {}
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref DbSecretArn
        - SQSSendMessagePolicy:
            QueueName: !GetAtt WooCommerceProductScrapeQueue.QueueName
      # No schedule wired up yet (unlike UrlDiscoveryFunction's daily
      # trigger) -- add once SwagBrandId is actually set for a real
      # deployment; a schedule referencing an empty BrandId isn't useful.

  WooCommerceProductScraperFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: bowling-scraper-woocommerce-product-scraper
      CodeUri: src/woocommerce_product_scraper/
      Handler: app.handler
      Timeout: 30
      Environment:
        Variables:
          IMAGE_PROCESS_QUEUE_URL: !Ref ImageProcessQueue
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref DbSecretArn
        - SQSSendMessagePolicy:
            QueueName: !GetAtt ImageProcessQueue.QueueName
      Events:
        WooCommerceProductScrapeQueueTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt WooCommerceProductScrapeQueue.Arn
            BatchSize: 5
            FunctionResponseTypes:
              - ReportBatchItemFailures
      # SQS-triggered from WooCommerceProductScrapeQueue (populated by
      # WooCommerceUrlDiscoveryFunction) -- also still accepts
      # direct/manual invocation with {"url": "...", "brand_id": "..."}.
      # Fans out to the SAME ImageProcessQueue/ImageProcessorFunction the
      # Craft-CMS family uses -- that function's job shape and processing
      # are both platform-agnostic.

  # --- NetSuite brand family (MOTIV Bowling to start) ---
  #
  # A third platform, added this session -- see
  # src/netsuite_url_discovery/app.py and netsuite_product_scraper/app.py
  # module docstrings for the real, confirmed platform differences
  # (per-weight RG/DIFF/mass-bias in HTML like SWAG but unlike Brunswick;
  # status split across two dedicated catalog-index pages rather than a
  # URL path segment or an on-page attribute; colorway sometimes baked
  # into the product name itself).
  #
  # UNVERIFIED, disclosed explicitly: fetch_page() in
  # netsuite_product_scraper uses a session-cookie-first approach to work
  # around product pages returning blank to a plain non-browser request
  # (confirmed real this session, via both this sandbox's fetch tool and
  # a prior session's research) -- but this sandbox has no outbound path
  # to motivbowling.com to actually prove that workaround succeeds. Treat
  # the first real deployment run of this function as the actual test of
  # that approach, not something already confirmed working.
  #
  # Now wired into their own SQS chain, same shape as the WooCommerce pair
  # above: NetsuiteUrlDiscoveryFunction publishes to
  # NetsuiteProductScrapeQueue, NetsuiteProductScraperFunction consumes it
  # and fans out to the shared ImageProcessQueue. Not a PdfParseQueue
  # trigger target (mass bias already comes from HTML here too).
  #
  # Worth remembering: wiring this queue doesn't make the underlying fetch
  # problem go away -- NetsuiteProductScraperFunction's fetch_page() is
  # still the unverified session-cookie workaround (see its module
  # docstring and the README's "Third manufacturer: MOTIV Bowling"
  # section). If it doesn't actually work against the real site, messages
  # will fail, retry up to maxReceiveCount, and land in
  # NetsuiteProductScrapeDLQ -- that's the queue to check first.

  NetsuiteUrlDiscoveryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: bowling-scraper-netsuite-url-discovery
      CodeUri: src/netsuite_url_discovery/
      Handler: app.handler
      Environment:
        Variables:
          CURRENT_CATEGORY_URL: !Ref MotivCurrentCategoryUrl
          RETIRED_CATEGORY_URL: !Ref MotivRetiredCategoryUrl
          BRAND_ID: !Ref MotivBrandId
          PRODUCT_SCRAPE_QUEUE_URL: !Ref NetsuiteProductScrapeQueue
      Policies:
        - VPCAccessPolicy: {}
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref DbSecretArn
        - SQSSendMessagePolicy:
            QueueName: !GetAtt NetsuiteProductScrapeQueue.QueueName
      # No schedule wired up yet, same reasoning as WooCommerceUrlDiscoveryFunction.

  NetsuiteProductScraperFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: bowling-scraper-netsuite-product-scraper
      CodeUri: src/netsuite_product_scraper/
      Handler: app.handler
      Timeout: 30
      Environment:
        Variables:
          IMAGE_PROCESS_QUEUE_URL: !Ref ImageProcessQueue
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref DbSecretArn
        - SQSSendMessagePolicy:
            QueueName: !GetAtt ImageProcessQueue.QueueName
      Events:
        NetsuiteProductScrapeQueueTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt NetsuiteProductScrapeQueue.Arn
            BatchSize: 5
            FunctionResponseTypes:
              - ReportBatchItemFailures
      # SQS-triggered from NetsuiteProductScrapeQueue (populated by
      # NetsuiteUrlDiscoveryFunction, which sets "status" in the message
      # body -- see that module's docstring, status has no reliable
      # on-page source for MOTIV) -- also still accepts direct/manual
      # invocation with {"url": "...", "brand_id": "...", "status": "..."}.

Outputs:
  UrlDiscoveryFunctionArn:
    Value: !GetAtt UrlDiscoveryFunction.Arn
  ProductScraperFunctionArn:
    Value: !GetAtt ProductScraperFunction.Arn
  PdfParserFunctionArn:
    Value: !GetAtt PdfParserFunction.Arn
  ImageProcessorFunctionArn:
    Value: !GetAtt ImageProcessorFunction.Arn
  ImageBucketName:
    Value: !Ref ImageBucket
  AdminApiUrl:
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/"
  ProductScrapeDLQUrl:
    Value: !Ref ProductScrapeDLQ
  PdfParseDLQUrl:
    Value: !Ref PdfParseDLQ
  ImageProcessDLQUrl:
    Value: !Ref ImageProcessDLQ
  WooCommerceProductScrapeDLQUrl:
    Value: !Ref WooCommerceProductScrapeDLQ
  NetsuiteProductScrapeDLQUrl:
    Value: !Ref NetsuiteProductScrapeDLQ
  WooCommerceUrlDiscoveryFunctionArn:
    Value: !GetAtt WooCommerceUrlDiscoveryFunction.Arn
  WooCommerceProductScraperFunctionArn:
    Value: !GetAtt WooCommerceProductScraperFunction.Arn
  NetsuiteUrlDiscoveryFunctionArn:
    Value: !GetAtt NetsuiteUrlDiscoveryFunction.Arn
  NetsuiteProductScraperFunctionArn:
    Value: !GetAtt NetsuiteProductScraperFunction.Arn
