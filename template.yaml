AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Bowling ball scraper/database. Sitemap-driven URL discovery, per-manufacturer
  HTML + PDF product scraping, image mirroring/normalization, QA cross-checks,
  and an admin approval API sitting in front of a shared Postgres schema.

  Per-manufacturer scrape pipelines (Brunswick/Craft CMS, SWAG/WooCommerce,
  MOTIV/NetSuite) are chained end to end via SQS: a URL discovery function
  publishes to a product-scrape queue, whose consumer publishes to PDF-parse
  and image-process queues as needed. AdminApiFunction sits apart from the
  chain as a real HTTP API behind a shared-secret authorizer. See README.md
  and DEPLOY_RUNBOOK.md for full details -- kept short here to stay under
  CloudFormation's 1024-char template Description limit.

Globals:
  Function:
    Runtime: python3.13
    Timeout: 60
    MemorySize: 256
    Environment:
      Variables:
        DB_SECRET_ARN: !Ref DbSecretArn
        POWERTOOLS_SERVICE_NAME: bowling-scraper

Parameters:
  DbSecretArn:
    Type: String
    Description: >
      ARN of a Secrets Manager secret holding {host, port, dbname, username,
      password} for the Postgres instance. Not created by this template --
      point it at your existing RDS instance/secret once you provision one.
  SitemapUrl:
    Type: String
    Default: https://brunswickbowling.com/sitemaps-1-section-bowlerProducts-1-sitemap.xml
    Description: >
      Brunswick's product sitemap. Radical and DV8 share the same Craft CMS
      template/URL shape (confirmed live) and are now onboarded as their own
      RadicalUrlDiscoveryFunction/Dv8UrlDiscoveryFunction resources below,
      reusing this same src/url_discovery/ code with their own
      RadicalSitemapUrl/Dv8SitemapUrl + RadicalBrandId/Dv8BrandId params,
      inside this same stack -- same convention as SwagBrandId/MotivBrandId
      rather than the separate-stack-per-brand approach this description
      used to suggest before that pattern was established.
  UrlPathPattern:
    Type: String
    Default: /products/balls/(current|retired)/
    Description: >
      Regex matched against sitemap <loc> paths to keep only ball product
      pages. Shared across the whole Craft-CMS family -- confirmed the same
      URL shape holds for Radical/DV8 too, so RadicalUrlDiscoveryFunction/
      Dv8UrlDiscoveryFunction reuse this one parameter rather than getting
      their own copies.
  BrandId:
    Type: String
    Description: >
      UUID of the row in the `brands` table this deployment discovers URLs
      for (see db/migrations/001_init_schema.sql). Insert the brand row via
      the migration/seed data before deploying, then pass its id here.
  RadicalSitemapUrl:
    Type: String
    Default: https://radicalbowling.com/sitemaps-1-section-bowlerProducts-1-sitemap.xml
    Description: >
      Confirmed live this session -- same Craft CMS/SEOmatic sitemap shape
      as SitemapUrl above, just Radical's domain.
  RadicalBrandId:
    Type: String
    Default: ""
    Description: >
      UUID of the `brands` row for Radical. Left blank by default, same
      reasoning as SwagBrandId -- required once you actually enable
      RadicalUrlDiscoveryFunction. Insert the brand row (see
      DEPLOY_RUNBOOK.md section 4) before setting this.
  Dv8SitemapUrl:
    Type: String
    Default: https://dv8bowling.com/sitemaps-1-section-bowlerProducts-1-sitemap.xml
    Description: >
      Confirmed live this session -- same Craft CMS/SEOmatic sitemap shape
      as SitemapUrl above, just DV8's domain.
  Dv8BrandId:
    Type: String
    Default: ""
    Description: >
      UUID of the `brands` row for DV8. Left blank by default, same
      reasoning as RadicalBrandId -- required once you actually enable
      Dv8UrlDiscoveryFunction.
  SwagCategoryUrl:
    Type: String
    Default: https://www.swagbowling.com/shop/bowling-balls/
    Description: >
      WooCommerce category archive URL WooCommerceUrlDiscoveryFunction
      paginates through to find ball product URLs (SWAG's flat product
      sitemap mixes balls with apparel/accessories, so this is the actual
      filtering mechanism -- see src/woocommerce_url_discovery/app.py).
  SwagSitemapUrl:
    Type: String
    Default: https://www.swagbowling.com/product-sitemap.xml
    Description: Yoast SEO product sitemap, used only for its per-URL <lastmod> values.
  SwagBrandId:
    Type: String
    Default: ""
    Description: >
      UUID of the `brands` row for SWAG Bowling. Left blank by default so
      this template still deploys standalone for just the Craft-CMS family
      (BrandId above) without requiring a second brand row up front --
      required once you actually enable the WooCommerce functions.
  MotivCurrentCategoryUrl:
    Type: String
    Default: https://www.motivbowling.com/products/balls/
    Description: >
      NetSuite catalog index page NetsuiteUrlDiscoveryFunction reads for
      currently-for-sale balls -- confirmed real, single-page (no
      pagination), all product links present as plain <a href="/n_<id>">
      tags -- see src/netsuite_url_discovery/app.py.
  MotivRetiredCategoryUrl:
    Type: String
    Default: https://www.motivbowling.com/products/balls/retired-balls/
    Description: Same as MotivCurrentCategoryUrl but for the retired-balls index (202 links as of this session).
  MotivBrandId:
    Type: String
    Default: ""
    Description: >
      UUID of the `brands` row for MOTIV Bowling. Left blank by default,
      same reasoning as SwagBrandId -- required once you actually enable
      the NetSuite functions.
  CommercebuildCategoryUrl:
    Type: String
    Default: https://www.stormbowling.com/products/equipment/bowling-balls/
    Description: >
      commercebuild/XM Symphony "Bowling Balls" category listing --
      CommercebuildUrlDiscoveryFunction filters it per brand via a
      custom1 facet query param (see src/commercebuild_url_discovery/app.py).
      One site serves all three commercebuild brands, so unlike
      SwagCategoryUrl/MotivCurrentCategoryUrl this single URL covers all
      of them. Only ever finds CURRENT products (this category listing has
      no retired/archived items) -- see CommercebuildSitemapUrl below for
      how archived products get discovered.
  CommercebuildSitemapUrl:
    Type: String
    Default: https://www.stormbowling.com/sitemap_products.xml
    Description: >
      Confirmed real this session: a public, un-gated sitemap listing all
      958 commercebuild products (balls AND non-ball merchandise mixed
      together) in their flat canonical URL form, covering BOTH current
      and archived products side by side. This replaces the "Bowling
      Balls Archive" collection listing as the archived-product discovery
      source -- that collection page was found to 302-redirect to
      /user/login (gated behind auth), which is the real reason its own
      product links 404'd on a bare request (see
      src/commercebuild_url_discovery/app.py's module docstring). The
      sitemap doesn't distinguish current/archived/non-ball itself --
      CommercebuildProductScraperFunction classifies each URL by its own
      page's breadcrumb trail at scrape time and skips non-ball products
      gracefully (see that function's classify_product_status()).
  StormBrandId:
    Type: String
    Default: ""
    Description: >
      UUID of the `brands` row for Storm. Left blank by default, same
      reasoning as SwagBrandId/MotivBrandId -- required once you actually
      enable the commercebuild functions. Fed into
      CommercebuildUrlDiscoveryFunction's BRAND_IDS_JSON env var alongside
      RotoGripBrandId/Global900BrandId (one function covers all three
      brands, so this template keeps the established one-parameter-per-
      brand convention rather than switching to a single combined-JSON
      parameter -- see that function's Environment block below for how
      the three are assembled).
  RotoGripBrandId:
    Type: String
    Default: ""
    Description: UUID of the `brands` row for Roto Grip. Same reasoning as StormBrandId.
  Global900BrandId:
    Type: String
    Default: ""
    Description: UUID of the `brands` row for 900 Global. Same reasoning as StormBrandId.
  HammerStoreDomain:
    Type: String
    Default: hammerbowling.com
    Description: >
      A fourth platform, added a prior session -- see
      src/shopify_url_discovery/app.py and shopify_product_scraper/app.py
      module docstrings for the real, confirmed platform differences
      (collection-membership-based discovery via Shopify's public
      /collections/{handle}/products.json endpoint instead of a sitemap or
      scraped listing page; RG/DIFF/ASY already in HTML like SWAG/MOTIV but
      unlike Brunswick; no on-page current/retired signal at all, unlike
      every other family, so status is resolved once at discovery time from
      collection membership and read back by the scraper). Track and
      Ebonite share this same Shopify platform -- confirmed live this
      session (trackbowling.com/ebonite.com) -- and are wired up below as
      TrackUrlDiscoveryFunction/EboniteUrlDiscoveryFunction, each a second/
      third instance of ShopifyUrlDiscoveryFunction's CodeUri with their
      own StoreDomain/CollectionHandles/BrandId params, same reuse
      convention RadicalUrlDiscoveryFunction/Dv8UrlDiscoveryFunction
      already use for url_discovery/app.py. Note Track and Ebonite's
      product-page markup is NOT identical to Hammer's, though --
      shopify_product_scraper/app.py's module docstring covers the real
      <table>-vs-<ul> difference this required.
  HammerCollectionHandles:
    Type: String
    Default: "high-performance,upper-mid-performance,mide-performance,lower-mid-performance,polyester,retired-balls"
    Description: >
      Comma-separated Shopify collection handles ShopifyUrlDiscoveryFunction
      crawls for Hammer. Confirmed live this session, including the real
      "mide-performance" typo on Hammer's own site (not a bug here) and
      "retired-balls" as a genuinely separate collection from the five
      current-ball performance tiers (see HammerStoreDomain's description).
  HammerBrandId:
    Type: String
    Default: ""
    Description: >
      UUID of the `brands` row for Hammer (source_platform='shopify'). Left
      blank by default, same reasoning as SwagBrandId/MotivBrandId/
      StormBrandId -- required once you actually enable
      ShopifyUrlDiscoveryFunction.
  TrackStoreDomain:
    Type: String
    Default: trackbowling.com
    Description: >
      Confirmed live this session (collections.json, retired-balls
      collection, /products/{handle}.json all present and Shopify-shaped,
      same signals used to confirm Hammer). See HammerStoreDomain's
      description for the shared-platform reasoning.
  TrackCollectionHandles:
    Type: String
    Default: "balls,retired-balls"
    Description: >
      REAL INCIDENT, updated this session: Al reported "track is missing
      balls" on the admin site. Refetched trackbowling.com/collections.json
      live and found high-performance/upper-mid-performance/mid-performance
      all now report products_count: 0 -- Track restructured its site at
      some point after the tier-handle set below was originally confirmed,
      consolidating every current ball into one real collection instead
      (handle "balls", products_count: 7, sibling site Ebonite's own
      collections.json literally titles the equivalent collection "Current
      Ball Lineup" -- same handle, same role, confirms this is the right
      one to use). Only "polyester" (1 product) was still being found under
      the old tier-handle config below, so TrackUrlDiscoveryFunction was
      silently discovering just 1 of Track's ~7 current balls. Confirmed
      this is Track-specific, not a platform-wide Shopify-theme change:
      Hammer's and Ebonite's own tier collections (high-performance,
      mide-performance/mid-performance, lower-mid-performance,
      pro-performance, etc.) still report real non-zero counts live, and
      Ebonite's tier-handle sum (1+6+3+1=11) exactly matches its own
      "balls" collection count (11), confirming Ebonite's config is still
      complete and doesn't need this same fix.

      Old default (now stale, kept here in history for context): "high-
      performance,upper-mid-performance,mid-performance,polyester,
      retired-balls" -- confirmed live via trackbowling.com/collections.json
      when Track was first onboarded (Track had no lower-mid-performance
      collection at all then, and correctly spelled "mid-performance"
      unlike Hammer's "mide-performance" typo) -- accurate at the time,
      just overtaken by Track's own later site reorganization into a
      single collection. build_entries() in shopify_url_discovery/app.py
      treats any handle not in RETIRED_COLLECTION_HANDLES as a current-tier
      signal, so switching to "balls" here needs no code change, just this
      config update (plus the matching samconfig.toml parameter_overrides
      value, which is the one that actually took effect on the last real
      deploy).
  TrackBrandId:
    Type: String
    Default: ""
    Description: >
      UUID of the `brands` row for Track (source_platform='shopify'). Left
      blank by default, same reasoning as HammerBrandId -- required once
      you actually enable TrackUrlDiscoveryFunction.
  EboniteStoreDomain:
    Type: String
    Default: ebonite.com
    Description: >
      Confirmed live this session (collections.json, retired-balls
      collection, /products/{handle}.json all present and Shopify-shaped,
      same signals used to confirm Hammer). See HammerStoreDomain's
      description for the shared-platform reasoning.
  EboniteCollectionHandles:
    Type: String
    Default: "pro-performance,high-performance,mid-performance,lower-mid-performance,polyester,retired-balls"
    Description: >
      Confirmed live this session via ebonite.com/collections.json --
      also deliberately NOT the same set as Hammer/Track: Ebonite has no
      upper-mid-performance collection at all, but does have a
      pro-performance tier neither Hammer nor Track has (confirmed via
      collections.json's own product_count field, not assumed).
  EboniteBrandId:
    Type: String
    Default: ""
    Description: >
      UUID of the `brands` row for Ebonite (source_platform='shopify').
      Left blank by default, same reasoning as HammerBrandId -- required
      once you actually enable EboniteUrlDiscoveryFunction.
  BigCommerceSecretArn:
    Type: String
    Default: ""
    Description: >
      ARN of a Secrets Manager secret holding {store_hash, auth_token} for
      BowlerDepot's BigCommerce store -- separate from DbSecretArn since
      it's a different kind of credential with its own rotation story.
  AdminApiTokenSecretArn:
    Type: String
    Default: ""
    Description: >
      ARN of a Secrets Manager secret holding the bearer token admin API
      callers must send as "Authorization: Bearer <token>" -- either a
      bare token string or JSON {"token": "..."}, see
      src/admin_api_authorizer/app.py's module docstring. Required before
      AdminApiFunction is reachable: left blank by default, which makes
      every request to the admin API fail closed (see
      AdminApiAuthorizerFunction below) rather than silently allowing
      unauthenticated access.
  YouTubeApiKeySecretArn:
    Type: String
    Default: ""
    Description: >
      ARN of a Secrets Manager secret holding a Google Cloud YouTube Data
      API v3 key -- either a bare key string or JSON {"api_key": "..."},
      see src/video_discovery/app.py's get_youtube_api_key(). This is a
      real credential this project can't obtain on its own (a Google Cloud
      console API key, same "user has to get this themselves" category as
      BigCommerceSecretArn/AdminApiTokenSecretArn above). Left blank by
      default, same fail-closed reasoning as those two -- see
      HasYouTubeApiKeySecret below. Note the search.list quota this key is
      subject to (100 units/call, 10,000/day default project quota -- see
      video_discovery's module docstring) is a hard ceiling independent of
      this template.
  BedrockModelId:
    Type: String
    Default: global.anthropic.claude-haiku-4-5-20251001-v1:0
    Description: >
      Bedrock modelId video_summarizer passes to InvokeModel. Updated to
      Claude Haiku 4.5's Global cross-Region inference profile ID, not the
      bare on-demand model ID -- confirmed via Bedrock's own model-card page
      that Claude Haiku 4.5 has NO in-Region (on-demand) support in
      us-west-1 (N. California, where this stack's YouTube secret and,
      presumably, the rest of this stack live) -- only Geographic and
      Global cross-Region inference are available there. Global was chosen
      over the Geographic (US) profile because its IAM policy doesn't need
      a hardcoded destination-Region list (see VideoSummarizerFunction's
      Policies below, and BedrockBaseModelId just below) -- Geographic
      profiles route to a fixed, source-Region-dependent set of Regions
      that would have to be hardcoded here and would silently go stale if
      this stack is ever redeployed to a different source Region. If you
      deploy this stack somewhere with real in-Region support for whatever
      model you choose, you can simplify back to a bare model ID and a
      single-resource IAM policy -- check that model's own "Regional
      availability" table in the Bedrock console/docs first, don't assume.
  BedrockBaseModelId:
    Type: String
    Default: anthropic.claude-haiku-4-5-20251001-v1:0
    Description: >
      The underlying foundation model id BedrockModelId's inference profile
      is built on -- i.e. BedrockModelId with its "global."/"us."/etc.
      prefix stripped. Needed as a separate parameter because
      VideoSummarizerFunction's IAM policy has to grant bedrock:InvokeModel
      on the foundation-model resource itself (in the source Region AND,
      for Global CRIS, a region-less wildcard resource) IN ADDITION TO the
      inference-profile resource -- this is AWS's own documented 3-statement
      policy shape for Global cross-Region inference, not something
      invented here (see
      https://docs.aws.amazon.com/bedrock/latest/userguide/global-cross-region-inference.html#global-cris-iam-setup).
      CloudFormation has no string-strip function to derive this from
      BedrockModelId automatically, hence the second parameter -- keep the
      two in sync if you ever change the model.

Conditions:
  HasBigCommerceSecret: !Not [!Equals [!Ref BigCommerceSecretArn, ""]]
  HasAdminApiToken: !Not [!Equals [!Ref AdminApiTokenSecretArn, ""]]
  HasYouTubeApiKeySecret: !Not [!Equals [!Ref YouTubeApiKeySecretArn, ""]]

Resources:
  ImageBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub bowling-scraper-images-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      # Public-read is intentional -- these are the normalized product
      # images the consumer site serves directly by URL (stored_url in
      # product_images), not internal working data. Revisit if serving
      # through CloudFront instead of raw S3 URLs later.

  ImageBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ImageBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub arn:aws:s3:::${ImageBucket}/*

  # --- Orchestration queues ---
  #
  # One queue + DLQ per hand-off in the pipeline. VisibilityTimeout is 6x
  # the consuming function's Timeout (30s), the multiplier AWS recommends
  # for SQS-Lambda so a message isn't picked up again mid-processing before
  # the function has had a chance to finish and delete it. maxReceiveCount
  # of 3 on each DLQ redrive policy: fail three times (including transient
  # errors), then stop retrying and let a human look at the DLQ rather than
  # retrying forever.

  ProductScrapeDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: bowling-scraper-product-scrape-dlq

  ProductScrapeQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: bowling-scraper-product-scrape
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ProductScrapeDLQ.Arn
        maxReceiveCount: 3

  PdfParseDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: bowling-scraper-pdf-parse-dlq

  PdfParseQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: bowling-scraper-pdf-parse
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt PdfParseDLQ.Arn
        maxReceiveCount: 3

  ImageProcessDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: bowling-scraper-image-process-dlq

  ImageProcessQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: bowling-scraper-image-process
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ImageProcessDLQ.Arn
        maxReceiveCount: 3

  # Separate scrape queues per platform family, not a shared
  # ProductScrapeQueue -- each platform's product scraper Lambda expects a
  # different job shape and calls entirely different parsing code, so
  # they can't share one consumer the way PDF parsing and image
  # processing can (those two ARE platform-agnostic, hence the shared
  # ImageProcessQueue below). Same VisibilityTimeout/maxReceiveCount
  # convention as every other queue pair in this template.

  WooCommerceProductScrapeDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: bowling-scraper-woocommerce-product-scrape-dlq

  WooCommerceProductScrapeQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: bowling-scraper-woocommerce-product-scrape
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt WooCommerceProductScrapeDLQ.Arn
        maxReceiveCount: 3

  NetsuiteProductScrapeDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: bowling-scraper-netsuite-product-scrape-dlq

  NetsuiteProductScrapeQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: bowling-scraper-netsuite-product-scrape
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt NetsuiteProductScrapeDLQ.Arn
        maxReceiveCount: 3

  VideoSummarizeDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: bowling-scraper-video-summarize-dlq

  VideoSummarizeQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: bowling-scraper-video-summarize
      # 180s, same as every other scraper queue. Name kept as-is (not
      # renamed to something like "video-transcript-fetch") even though
      # VideoTranscriptFetcherFunction is now this queue's consumer, not
      # VideoSummarizerFunction -- renaming an SQS::Queue's QueueName forces
      # CloudFormation to replace the resource (a new physical queue),
      # which would silently drop any in-flight messages at deploy time.
      # See VideoTranscriptResultQueue below for the second stage.
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt VideoSummarizeDLQ.Arn
        maxReceiveCount: 3

  VideoTranscriptResultDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: bowling-scraper-video-transcript-result-dlq

  VideoTranscriptResultQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: bowling-scraper-video-transcript-result
      # Second stage of the split-architecture pipeline (see the "YouTube
      # content enrichment" section below): VideoTranscriptFetcherFunction
      # publishes here once it's fetched (or failed to fetch) a transcript,
      # VideoSummarizerFunction consumes it to do the DB write + Bedrock
      # call. Same 180s/maxReceiveCount:3 convention as every other queue
      # pair in this template.
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt VideoTranscriptResultDLQ.Arn
        maxReceiveCount: 3

  CommercebuildProductScrapeDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: bowling-scraper-commercebuild-product-scrape-dlq

  CommercebuildProductScrapeQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: bowling-scraper-commercebuild-product-scrape
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt CommercebuildProductScrapeDLQ.Arn
        maxReceiveCount: 3

  ShopifyProductScrapeDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: bowling-scraper-shopify-product-scrape-dlq

  ShopifyProductScrapeQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: bowling-scraper-shopify-product-scrape
      # Shared by any brand on this platform (Hammer now, Track/Ebonite
      # potentially later) -- same one-queue-per-platform-family reasoning
      # as WooCommerceProductScrapeQueue/NetsuiteProductScrapeQueue, since
      # ShopifyProductScraperFunction's job shape/parsing code is
      # brand-agnostic (see shopify_product_scraper/app.py).
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ShopifyProductScrapeDLQ.Arn
        maxReceiveCount: 3

  UrlDiscoveryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: bowling-scraper-url-discovery
      CodeUri: src/url_discovery/
      Handler: app.handler
      Environment:
        Variables:
          SITEMAP_URL: !Ref SitemapUrl
          URL_PATH_PATTERN: !Ref UrlPathPattern
          BRAND_ID: !Ref BrandId
          PRODUCT_SCRAPE_QUEUE_URL: !Ref ProductScrapeQueue
      Policies:
        - VPCAccessPolicy: {}
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref DbSecretArn
        - SQSSendMessagePolicy:
            QueueName: !GetAtt ProductScrapeQueue.QueueName
      Events:
        DailySchedule:
          Type: Schedule
          Properties:
            # Daily is a starting point, not a hard requirement -- the
            # architecture doc recommends triggering off sitemap <lastmod>
            # rather than a blind full re-crawl once this is proven out.
            Schedule: rate(1 day)
            Name: bowling-scraper-url-discovery-daily
            Description: Sitemap diff against discovered_urls; emits new/changed product URLs.
            Enabled: true

  # Radical and DV8 -- same Craft CMS platform as Brunswick (confirmed live
  # this session: identical SEOmatic sitemap shape, identical
  # /products/balls/(current|retired)/<slug> URL structure, identical
  # spec-table/RG-DIFF markup on the product pages themselves). No new
  # scraper code needed -- ProductScraperFunction already takes {url,
  # brand_id} as plain pass-through job parameters with zero
  # Brunswick-specific hardcoding, so both of these publish straight onto
  # the SAME ProductScrapeQueue that function already consumes. Only the
  # URL-discovery step needs a new deployment per brand, reusing
  # src/url_discovery/'s existing, already-generic code -- exactly what
  # that module's own docstring anticipated.
  #
  # No schedule wired up yet, same reasoning as WooCommerceUrlDiscoveryFunction/
  # NetsuiteUrlDiscoveryFunction below -- add a Schedule event once
  # RadicalBrandId/Dv8BrandId are actually set for a real deployment (insert
  # the brand rows first, see DEPLOY_RUNBOOK.md section 4). Invoke manually
  # in the meantime.

  RadicalUrlDiscoveryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: bowling-scraper-radical-url-discovery
      CodeUri: src/url_discovery/
      Handler: app.handler
      Environment:
        Variables:
          SITEMAP_URL: !Ref RadicalSitemapUrl
          URL_PATH_PATTERN: !Ref UrlPathPattern
          BRAND_ID: !Ref RadicalBrandId
          PRODUCT_SCRAPE_QUEUE_URL: !Ref ProductScrapeQueue
      Policies:
        - VPCAccessPolicy: {}
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref DbSecretArn
        - SQSSendMessagePolicy:
            QueueName: !GetAtt ProductScrapeQueue.QueueName

  Dv8UrlDiscoveryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: bowling-scraper-dv8-url-discovery
      CodeUri: src/url_discovery/
      Handler: app.handler
      Environment:
        Variables:
          SITEMAP_URL: !Ref Dv8SitemapUrl
          URL_PATH_PATTERN: !Ref UrlPathPattern
          BRAND_ID: !Ref Dv8BrandId
          PRODUCT_SCRAPE_QUEUE_URL: !Ref ProductScrapeQueue
      Policies:
        - VPCAccessPolicy: {}
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref DbSecretArn
        - SQSSendMessagePolicy:
            QueueName: !GetAtt ProductScrapeQueue.QueueName

  ProductScraperFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: bowling-scraper-product-scraper
      CodeUri: src/product_scraper/
      Handler: app.handler
      # Raised from 30 to 150 alongside ImageProcessorFunction/
      # CommercebuildProductScraperFunction -- same BatchSize: 5
      # sequential-processing shape, and the commercebuild function was
      # directly confirmed timing out mid-batch in production. This one
      # hasn't been directly observed failing yet, but shares the
      # identical root-cause shape, so fixed proactively rather than
      # waiting to catch it failing too. Safely under ProductScrapeQueue's
      # VisibilityTimeout: 180.
      Timeout: 150
      Environment:
        Variables:
          PDF_PARSE_QUEUE_URL: !Ref PdfParseQueue
          IMAGE_PROCESS_QUEUE_URL: !Ref ImageProcessQueue
          # Ported from NetsuiteProductScraperFunction (MOTIV) -- Al
          # confirmed Brunswick needed the same image cleanup: upsert_
          # product's stale-image DELETE (see that function's docstring)
          # removes stray product_images DB rows on a rescrape, but the
          # matching S3 objects image_processor may have already mirrored
          # need cleaning up too. delete_orphaned_image_objects (called
          # from _process_one) is gated on this var being set, same
          # optional/soft-fail convention as IMAGE_PROCESS_QUEUE_URL above.
          IMAGE_BUCKET: !Ref ImageBucket
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref DbSecretArn
            # Same narrower-than-ImageProcessorFunction S3 grant as
            # NetsuiteProductScraperFunction -- ListBucket (for
            # delete_orphaned_image_objects' list_objects_v2 pagination,
            # a bucket-level permission) plus DeleteObject scoped to the
            # product-images/ prefix image_processor.upload_variants
            # actually writes under, nothing broader.
            - Effect: Allow
              Action:
                - s3:ListBucket
              Resource: !GetAtt ImageBucket.Arn
            - Effect: Allow
              Action:
                - s3:DeleteObject
              Resource: !Sub arn:aws:s3:::${ImageBucket}/product-images/*
        - SQSSendMessagePolicy:
            QueueName: !GetAtt PdfParseQueue.QueueName
        - SQSSendMessagePolicy:
            QueueName: !GetAtt ImageProcessQueue.QueueName
      Events:
        ProductScrapeQueueTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt ProductScrapeQueue.Arn
            BatchSize: 5
            FunctionResponseTypes:
              - ReportBatchItemFailures
      # SQS-triggered from ProductScrapeQueue (populated by
      # UrlDiscoveryFunction) -- also still accepts direct/manual
      # invocation with {"url": "...", "brand_id": "..."}, see
      # src/product_scraper/app.py's _extract_jobs.
      #
      # Only handles the Craft-CMS family (Brunswick/Radical/DV8) -- same
      # reasoning as UrlDiscoveryFunction re: reuse across those three brands.
      # Shopify family (Hammer/Ebonite/Track): pull {handle}.json directly,
      # no HTML parsing at all, needs its own function.

  PdfParserFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: bowling-scraper-pdf-parser
      CodeUri: src/pdf_parser/
      Handler: app.handler
      # Raised from 30 to 150, same reasoning as ProductScraperFunction/
      # ImageProcessorFunction/CommercebuildProductScraperFunction above.
      Timeout: 150
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref DbSecretArn
      Events:
        PdfParseQueueTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt PdfParseQueue.Arn
            BatchSize: 5
            FunctionResponseTypes:
              - ReportBatchItemFailures
      # SQS-triggered from PdfParseQueue (populated by ProductScraperFunction
      # whenever a scraped page had an info_sheet_url) -- also still accepts
      # direct/manual invocation with {"info_sheet_url": "...",
      # "product_id": "..."}. Independently-failing from the HTML step on
      # purpose: a PDF-parsing miss shouldn't block the HTML-derived fields
      # already saved (they're two separate queues/functions, not one
      # invocation doing both).

  ImageProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: bowling-scraper-image-processor
      CodeUri: src/image_processor/
      Handler: app.handler
      # Real bug found via production CloudWatch logs: image_processor/
      # app.py's handler processes each SQS batch of up to 5 images
      # SEQUENTIALLY (fetch + process per job, real durations of several
      # seconds up to ~20s+ per image observed in logs). The old 30s
      # timeout was tight enough that real batches were hitting a hard
      # Lambda timeout mid-batch -- confirmed via "Status: timeout" REPORT
      # lines in production logs. A hard timeout kills the whole
      # invocation with NO partial batchItemFailures reported, so all 5
      # items in that batch get retried as a block rather than just the
      # slow one -- this was a real, meaningful contributor to
      # ImageProcessDLQ's growth (774 messages observed), not just the
      # account's separate 10-execution concurrency ceiling. Raised to
      # 150s, safely under ImageProcessQueue's VisibilityTimeout: 180
      # (needs to stay under that or SQS could redeliver a message while
      # it's still being processed).
      Timeout: 150
      MemorySize: 512
      Environment:
        Variables:
          IMAGE_BUCKET: !Ref ImageBucket
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref DbSecretArn
        - S3CrudPolicy:
            BucketName: !Ref ImageBucket
      Events:
        ImageProcessQueueTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt ImageProcessQueue.Arn
            BatchSize: 5
            FunctionResponseTypes:
              - ReportBatchItemFailures
      # SQS-triggered from ImageProcessQueue (populated by
      # ProductScraperFunction for any product_images row still missing
      # stored_url) -- also still accepts direct/manual invocation with
      # {"product_image_id": "...", "source_url": "..."}.

  AdminHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Auth:
        Authorizers:
          TokenAuthorizer:
            FunctionArn: !GetAtt AdminApiAuthorizerFunction.Arn
            FunctionPayloadType: REQUEST
            AuthorizerPayloadFormatVersion: "2.0"
            EnableSimpleResponses: true
            Identity:
              Headers:
                - Authorization
        DefaultAuthorizer: TokenAuthorizer
      # For admin-site/index.html (a single static HTML/JS page meant to be
      # opened directly from disk or hosted anywhere -- see that file's
      # header comment) to call this API from a browser, both the OPTIONS
      # preflight AND the real response need Access-Control-Allow-* headers.
      # HTTP API v2's built-in CorsConfiguration handles both automatically
      # -- critically, it also makes API Gateway answer OPTIONS preflight
      # requests itself, WITHOUT invoking TokenAuthorizer above, so an
      # unauthenticated browser preflight doesn't 401 before the real
      # (authenticated) request even goes out. AllowOrigins: "*" is fine
      # here specifically because AllowCredentials is left unset/false --
      # the admin page sends its bearer token as an explicit Authorization
      # header value (fetch's credentials mode is irrelevant to that), not
      # via cookies, so no browser will refuse the wildcard for this case.
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - PATCH
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Authorization
          - Content-Type
      # Explicit HttpApi resource (rather than the implicit one SAM
      # creates from a bare `Type: HttpApi` function event) specifically
      # so a Lambda authorizer can be attached -- see
      # AdminApiAuthorizerFunction below and its module docstring for the
      # shared-secret-bearer-token design and exactly what's fail-closed
      # by default. `Identity.Headers: [Authorization]` is the identity
      # source API Gateway uses to decide whether it can serve a cached
      # authorizer result for a repeat request with the same header
      # value -- this project's own token cache in
      # admin_api_authorizer/app.py is what actually avoids a Secrets
      # Manager call on every request, not this setting; see that
      # module's docstring for why the two aren't the same mechanism.

  AdminApiAuthorizerFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AdminApiAuthorizerFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${AdminHttpApi}/authorizers/*"
    # Found via a real failed deploy: with EVERY authenticated request
    # returning a bare 500 and NEITHER function's CloudWatch log group
    # even existing afterward, API Gateway never actually reached either
    # Lambda. Root cause: AdminHttpApi's Authorizers block above wires
    # the authorizer via a raw `FunctionArn: !GetAtt ...` reference, not
    # through one of SAM's own event-source connections (like an Api
    # event on a function) -- SAM only auto-generates the
    # AWS::Lambda::Permission API Gateway needs to invoke a function when
    # the connection is expressed that second way. A manually-specified
    # FunctionArn skips that auto-wiring entirely, so it has to be added
    # by hand. The unauthenticated-request 401 seen earlier was a red
    # herring -- HTTP API v2 short-circuits to 401 without ever invoking
    # the authorizer when the configured Identity.Headers source
    # (Authorization) is simply absent from the request, so that path
    # never exercised this bug.

  AdminApiAuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: bowling-scraper-admin-api-authorizer
      CodeUri: src/admin_api_authorizer/
      Handler: app.handler
      Timeout: 10
      Environment:
        Variables:
          ADMIN_API_TOKEN_SECRET_ARN: !Ref AdminApiTokenSecretArn
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              # AdminApiTokenSecretArn defaults to "" -- an empty string
              # isn't a valid IAM Resource value ("must be in ARN format or
              # *"), which fails changeset creation outright, so only
              # grant this permission once HasAdminApiToken confirms a
              # real ARN was supplied. (Found via a real failed deploy --
              # BowlerDepotReconciliationFunctionRole had the identical bug
              # against BigCommerceSecretArn; fixed the same way here.)
              Resource: !If
                - HasAdminApiToken
                - !Ref AdminApiTokenSecretArn
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:unused-*"
      # Shared-secret Lambda REQUEST authorizer for AdminHttpApi above.
      # Fails closed if AdminApiTokenSecretArn is left at its blank
      # default -- see the module docstring in
      # src/admin_api_authorizer/app.py for the full reasoning. The
      # Policies block above grants read access to whatever
      # AdminApiTokenSecretArn actually resolves to; when it's blank, the
      # policy instead points at a harmless placeholder ARN pattern that
      # matches nothing real (an empty Resource ARN isn't valid CFN/IAM,
      # so it can't just be left blank the way the env var can) -- the
      # function's own blank-env-var check is what actually matters here,
      # this is only to keep the policy itself well-formed. Set a real
      # secret ARN before the admin API is genuinely useful.

  AdminApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: bowling-scraper-admin-api
      CodeUri: src/admin_api/
      Handler: app.handler
      # Bumped from 15s -- POST /products/{id}/refresh-video-summary (see
      # service.refresh_video_reviews_rollup) adds a synchronous Bedrock
      # InvokeModel call to this function's request path, which the other
      # endpoints here don't have. 15s was fine when every endpoint was a
      # plain DB query; 30s leaves real headroom for that one call without
      # ballooning API Gateway's own timeout budget.
      Timeout: 30
      # Real, confirmed incident: running scripts/backfill_core_ids.py
      # (or the admin site's "Backfill missing core info" batch panel)
      # across the WHOLE catalog -- not just one brand -- started throwing
      # bare 503s from AdminHttpApi partway through, with NOTHING in this
      # function's own CloudWatch log group, meaning the invocation never
      # even started. Root cause, confirmed via `aws lambda
      # get-account-settings` and CloudWatch's Throttles metric on this
      # function: this AWS account's Lambda UnreservedConcurrentExecutions
      # is 10 (AWS's default low tier for a new/unverified account, not
      # the usual 1000) -- and every rescrape call this function issues
      # publishes onto one of five different platform scrape queues,
      # each with its own SQS-triggered Lambda that fires immediately and
      # shares that same tiny 10-slot pool. A backfill spanning every
      # platform at once can easily have all five scraper functions
      # running concurrently, leaving nothing left for this function's
      # own (single-threaded, one-request-at-a-time) invocation to grab
      # -- HTTP API v2 surfaces that specific Lambda-service throttle as
      # a plain 503, which is why nothing showed up in the app-level logs.
      #
      # A ReservedConcurrentExecutions: 2 reservation here was tried and
      # reverted -- real, confirmed deploy failure: "Specified
      # ReservedConcurrentExecutions for function decreases account's
      # UnreservedConcurrentExecution below its minimum value of [10]."
      # AWS enforces a hard floor of 10 concurrent executions that must
      # always remain in the account's *unreserved* pool -- since this
      # account's entire limit IS 10, there's nothing above that floor to
      # carve a reservation out of; reserving even 1 slot here is rejected
      # outright regardless of what number is used. There is no
      # template-level mitigation available until the account's total
      # limit is raised. scripts/backfill_core_ids.py's retry-with-backoff
      # (see its module docstring) is the only fix currently in place --
      # it's a client-side/script-level change, not a deploy, so it's
      # already in effect. Request a Lambda concurrency quota increase for
      # this account via AWS Service Quotas (service code `lambda`, quota
      # "Concurrent executions") before the next catalog-wide backfill --
      # once the account limit is meaningfully above 10, revisit adding
      # ReservedConcurrentExecutions back here, since retries alone are a
      # workaround for the underlying scarcity, not a substitute for
      # actually having enough concurrency.
      Environment:
        Variables:
          # Read by service.py's approve_video_candidate -- see its
          # module comment for why approving a video candidate has a
          # publish side effect that approving a review_queue row doesn't.
          VIDEO_SUMMARIZE_QUEUE_URL: !Ref VideoSummarizeQueue
          # Read by service.py's submit_video_transcript (POST
          # /video-candidates/{id}/transcript) -- lets a transcript fetched
          # from outside AWS entirely (see scripts/home_transcript_fetcher.py)
          # feed into the same VideoTranscriptResultQueue
          # video_transcript_fetcher publishes to, so video_summarizer
          # doesn't need to know or care which producer a given message
          # came from.
          TRANSCRIPT_RESULT_QUEUE_URL: !Ref VideoTranscriptResultQueue
          # Read by service.py's refresh_video_reviews_rollup (POST
          # /products/{id}/refresh-video-summary) -- same env var
          # VideoSummarizerFunction reads, same model.
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          # Read by service.py's queue_rescrape (POST
          # /products/{id}/rescrape, see SCRAPE_QUEUE_ENV_VAR_BY_PLATFORM)
          # -- one env var per platform's product-scrape queue, so a
          # rescrape lands on the exact same queue that platform's own
          # UrlDiscoveryFunction-equivalent already publishes to. Built
          # for the cores backfill (migration 007), but generically
          # useful for re-triggering any product's scrape on demand.
          PRODUCT_SCRAPE_QUEUE_URL: !Ref ProductScrapeQueue
          WOOCOMMERCE_PRODUCT_SCRAPE_QUEUE_URL: !Ref WooCommerceProductScrapeQueue
          NETSUITE_PRODUCT_SCRAPE_QUEUE_URL: !Ref NetsuiteProductScrapeQueue
          COMMERCEBUILD_PRODUCT_SCRAPE_QUEUE_URL: !Ref CommercebuildProductScrapeQueue
          SHOPIFY_PRODUCT_SCRAPE_QUEUE_URL: !Ref ShopifyProductScrapeQueue
          # Read by service.py's queue_video_discovery (POST
          # /products/{id}/discover-videos) -- unlike the scrape queues
          # above, VideoDiscoveryFunction has no queue in front of it to
          # publish onto (manual/direct invoke only, see its own module
          # docstring), so this is a function NAME for a direct
          # lambda:InvokeFunction call, not a queue URL.
          VIDEO_DISCOVERY_FUNCTION_NAME: !Ref VideoDiscoveryFunction
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref DbSecretArn
            # Same three-statement Global CRIS inference-profile grant
            # VideoSummarizerFunction needs -- see that function's
            # Policies block for the full reasoning (AWS's own documented
            # shape for Global cross-Region inference, not something
            # invented here).
            - Sid: GrantGlobalCrisInferenceProfileRegionAccess
              Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockModelId}"
            - Sid: GrantGlobalCrisInferenceProfileInRegionModelAccess
              Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/${BedrockBaseModelId}"
              Condition:
                StringEquals:
                  bedrock:InferenceProfileArn: !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockModelId}"
            - Sid: GrantGlobalCrisInferenceProfileGlobalModelAccess
              Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: !Sub "arn:aws:bedrock:::foundation-model/${BedrockBaseModelId}"
              Condition:
                StringEquals:
                  bedrock:InferenceProfileArn: !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockModelId}"
        - SQSSendMessagePolicy:
            QueueName: !GetAtt VideoSummarizeQueue.QueueName
        - SQSSendMessagePolicy:
            QueueName: !GetAtt VideoTranscriptResultQueue.QueueName
        # One SQSSendMessagePolicy per platform's product-scrape queue --
        # see PRODUCT_SCRAPE_QUEUE_URL and friends above, and
        # queue_rescrape's SCRAPE_QUEUE_ENV_VAR_BY_PLATFORM.
        - SQSSendMessagePolicy:
            QueueName: !GetAtt ProductScrapeQueue.QueueName
        - SQSSendMessagePolicy:
            QueueName: !GetAtt WooCommerceProductScrapeQueue.QueueName
        - SQSSendMessagePolicy:
            QueueName: !GetAtt NetsuiteProductScrapeQueue.QueueName
        - SQSSendMessagePolicy:
            QueueName: !GetAtt CommercebuildProductScrapeQueue.QueueName
        - SQSSendMessagePolicy:
            QueueName: !GetAtt ShopifyProductScrapeQueue.QueueName
        # For queue_video_discovery (POST /products/{id}/discover-videos)
        # -- scoped to exactly VideoDiscoveryFunction's own ARN, not a
        # blanket lambda:InvokeFunction grant, same "narrowest permission
        # that actually does the job" convention as the S3 policies on
        # the product scraper functions above.
        - Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !GetAtt VideoDiscoveryFunction.Arn
      # Four explicit per-method routes instead of a single `Method: ANY`
      # -- found via a real live test (curl OPTIONS /health with no
      # Authorization header returned a bare 401 "Unauthorized" from API
      # Gateway itself, not from this function or the authorizer's own
      # logic). Root cause: `ANY` matches every method INCLUDING OPTIONS,
      # so AdminHttpApi's CorsConfiguration (see that resource's own
      # comment) never gets to auto-generate the CORS preflight response
      # for this path -- API Gateway only does that when the path+method
      # has no explicit route of its own, and `ANY` already claims one.
      # With no auto-preflight, the OPTIONS request fell through to the
      # normal integration, which requires TokenAuthorizer, which (per
      # AdminApiAuthorizerFunctionInvokePermission's own comment above)
      # short-circuits to 401 without even invoking the authorizer when
      # Authorization is absent -- exactly what a real preflight request
      # looks like, since browsers never attach custom headers to it.
      # Splitting into the four methods admin_api/app.py actually defines
      # (GET/POST/PATCH/DELETE) leaves OPTIONS with no explicit route, so
      # CorsConfiguration's automatic (unauthenticated) preflight handling
      # applies instead.
      Events:
        AdminApiGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminHttpApi
            Path: /{proxy+}
            Method: GET
        AdminApiPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminHttpApi
            Path: /{proxy+}
            Method: POST
        AdminApiPatch:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminHttpApi
            Path: /{proxy+}
            Method: PATCH
        AdminApiDelete:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminHttpApi
            Path: /{proxy+}
            Method: DELETE
      # FastAPI + Mangum, per the architecture doc's decided workflow:
      # review everything on the initial catalog load, then steady-state
      # auto-approve except mismatched fields written to review_queue.
      # Auth is now handled one layer up, by AdminHttpApi's
      # TokenAuthorizer (see AdminApiAuthorizerFunction above) -- this
      # function itself trusts that anything API Gateway routes to it
      # already passed that check. It does NOT re-validate the
      # Authorization header itself; if you ever add a way to invoke this
      # function directly (bypassing API Gateway -- e.g. a test harness,
      # a second trigger), that path would skip the authorizer entirely.

  # --- Public read-only API (consumer-facing site) ---
  #
  # Al: "let's start on the consumer facing site... single page like
  # site... a page to view the bowling ball details... an intuitive way
  # to populate a ball comparison page... focus on current bowling balls
  # and a way to still view retired balls and suggest current balls that
  # best compare to the retired balls." See src/public_api/service.py's
  # module docstring for the full "why a separate function/HttpApi from
  # AdminApiFunction/AdminHttpApi" reasoning -- short version: this one is
  # meant to be wide open, no auth at all, and every query is hard-scoped
  # to products.published = true (that column exists specifically for
  # this, see 001_init_schema.sql's own comment on it).

  PublicHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      # Deliberately NO Auth block at all -- unlike AdminHttpApi, this API
      # has no authorizer to attach; every route is public by design.
      # AllowOrigins: "*" is safe here for the same reason it's safe on
      # AdminHttpApi (see that resource's own CORS comment): no
      # AllowCredentials, no cookie-based auth, nothing a malicious origin
      # could steal by being allowed to read the response.
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - OPTIONS
        AllowHeaders:
          - Content-Type
      # Explicit HttpApi resource (rather than the implicit one SAM
      # creates from a bare Type: HttpApi function event) purely for
      # consistency with AdminHttpApi and so PublicApiUrl below has a
      # stable logical id to reference -- no authorizer requires this the
      # way it did for AdminHttpApi.

  PublicApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: bowling-scraper-public-api
      CodeUri: src/public_api/
      Handler: app.handler
      Timeout: 30
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref DbSecretArn
      # Single explicit GET route (not Method: ANY) -- same reasoning as
      # AdminApiFunction's four explicit method routes below: an explicit
      # route claims only that method, leaving OPTIONS unclaimed so
      # PublicHttpApi's CorsConfiguration above auto-generates the
      # preflight response instead of the request falling through to this
      # function (which has no OPTIONS route registered in app.py and
      # would 404 on one). This function only ever defines GET routes
      # (read-only API, no POST/PATCH/DELETE), so one explicit method is
      # enough -- unlike AdminApiFunction, which needed four.
      Events:
        PublicApiGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref PublicHttpApi
            Path: /{proxy+}
            Method: GET
      # FastAPI + Mangum, same shape as AdminApiFunction. No auth
      # validation of any kind happens in this function or in front of
      # it -- see PublicHttpApi's own comment above.

  # --- WooCommerce brand family (SWAG Bowling to start) ---
  #
  # A genuinely different platform from everything above, added this
  # session -- see src/woocommerce_url_discovery/app.py and
  # woocommerce_product_scraper/app.py module docstrings for the real,
  # confirmed platform differences that drove their design (no per-weight
  # RG/DIFF table, mass bias already in HTML unlike Brunswick, category-
  # page-based discovery instead of sitemap-path filtering).
  #
  # Bundled into this same template/stack rather than a separate one, for
  # now -- consistent with how this template already covers multiple
  # Craft-CMS brands via redeploys with different parameters, just now
  # with a second platform's functions too. Worth reconsidering (separate
  # template/nested stack per platform family) once there's a third
  # platform or this file gets unwieldy -- not a problem yet with two.
  #
  # Now wired into their own SQS chain -- WooCommerceUrlDiscoveryFunction
  # publishes to WooCommerceProductScrapeQueue,
  # WooCommerceProductScraperFunction consumes it and fans out to the
  # shared ImageProcessQueue for any new images. Not a PDF-parser trigger
  # target: SWAG's HTML already carries RG/DIFF/mass-bias-when-present
  # directly, so PdfParseQueue doesn't apply to this brand the way it does
  # to Brunswick.

  WooCommerceUrlDiscoveryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: bowling-scraper-woocommerce-url-discovery
      CodeUri: src/woocommerce_url_discovery/
      Handler: app.handler
      Environment:
        Variables:
          CATEGORY_URL: !Ref SwagCategoryUrl
          SITEMAP_URL: !Ref SwagSitemapUrl
          BRAND_ID: !Ref SwagBrandId
          PRODUCT_SCRAPE_QUEUE_URL: !Ref WooCommerceProductScrapeQueue
      Policies:
        - VPCAccessPolicy: {}
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref DbSecretArn
        - SQSSendMessagePolicy:
            QueueName: !GetAtt WooCommerceProductScrapeQueue.QueueName
      # No schedule wired up yet (unlike UrlDiscoveryFunction's daily
      # trigger) -- add once SwagBrandId is actually set for a real
      # deployment; a schedule referencing an empty BrandId isn't useful.

  WooCommerceProductScraperFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: bowling-scraper-woocommerce-product-scraper
      CodeUri: src/woocommerce_product_scraper/
      Handler: app.handler
      # Raised from 30 to 150, same reasoning as ProductScraperFunction/
      # ImageProcessorFunction/CommercebuildProductScraperFunction above.
      Timeout: 150
      Environment:
        Variables:
          IMAGE_PROCESS_QUEUE_URL: !Ref ImageProcessQueue
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref DbSecretArn
        - SQSSendMessagePolicy:
            QueueName: !GetAtt ImageProcessQueue.QueueName
      Events:
        WooCommerceProductScrapeQueueTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt WooCommerceProductScrapeQueue.Arn
            BatchSize: 5
            FunctionResponseTypes:
              - ReportBatchItemFailures
      # SQS-triggered from WooCommerceProductScrapeQueue (populated by
      # WooCommerceUrlDiscoveryFunction) -- also still accepts
      # direct/manual invocation with {"url": "...", "brand_id": "..."}.
      # Fans out to the SAME ImageProcessQueue/ImageProcessorFunction the
      # Craft-CMS family uses -- that function's job shape and processing
      # are both platform-agnostic.

  # --- NetSuite brand family (MOTIV Bowling to start) ---
  #
  # A third platform, added this session -- see
  # src/netsuite_url_discovery/app.py and netsuite_product_scraper/app.py
  # module docstrings for the real, confirmed platform differences
  # (per-weight RG/DIFF/mass-bias in HTML like SWAG but unlike Brunswick;
  # status split across two dedicated catalog-index pages rather than a
  # URL path segment or an on-page attribute; colorway sometimes baked
  # into the product name itself).
  #
  # UNVERIFIED, disclosed explicitly: fetch_page() in
  # netsuite_product_scraper uses a session-cookie-first approach to work
  # around product pages returning blank to a plain non-browser request
  # (confirmed real this session, via both this sandbox's fetch tool and
  # a prior session's research) -- but this sandbox has no outbound path
  # to motivbowling.com to actually prove that workaround succeeds. Treat
  # the first real deployment run of this function as the actual test of
  # that approach, not something already confirmed working.
  #
  # Now wired into their own SQS chain, same shape as the WooCommerce pair
  # above: NetsuiteUrlDiscoveryFunction publishes to
  # NetsuiteProductScrapeQueue, NetsuiteProductScraperFunction consumes it
  # and fans out to the shared ImageProcessQueue. Not a PdfParseQueue
  # trigger target (mass bias already comes from HTML here too).
  #
  # Worth remembering: wiring this queue doesn't make the underlying fetch
  # problem go away -- NetsuiteProductScraperFunction's fetch_page() is
  # still the unverified session-cookie workaround (see its module
  # docstring and the README's "Third manufacturer: MOTIV Bowling"
  # section). If it doesn't actually work against the real site, messages
  # will fail, retry up to maxReceiveCount, and land in
  # NetsuiteProductScrapeDLQ -- that's the queue to check first.

  NetsuiteUrlDiscoveryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: bowling-scraper-netsuite-url-discovery
      CodeUri: src/netsuite_url_discovery/
      Handler: app.handler
      Environment:
        Variables:
          CURRENT_CATEGORY_URL: !Ref MotivCurrentCategoryUrl
          RETIRED_CATEGORY_URL: !Ref MotivRetiredCategoryUrl
          BRAND_ID: !Ref MotivBrandId
          PRODUCT_SCRAPE_QUEUE_URL: !Ref NetsuiteProductScrapeQueue
      Policies:
        - VPCAccessPolicy: {}
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref DbSecretArn
        - SQSSendMessagePolicy:
            QueueName: !GetAtt NetsuiteProductScrapeQueue.QueueName
      # No schedule wired up yet, same reasoning as WooCommerceUrlDiscoveryFunction.

  NetsuiteProductScraperFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: bowling-scraper-netsuite-product-scraper
      CodeUri: src/netsuite_product_scraper/
      Handler: app.handler
      # Raised from 30 to 150, same reasoning as ProductScraperFunction/
      # ImageProcessorFunction/CommercebuildProductScraperFunction above.
      Timeout: 150
      Environment:
        Variables:
          IMAGE_PROCESS_QUEUE_URL: !Ref ImageProcessQueue
          # Real, confirmed follow-up fix: upsert_product's stale-image
          # cleanup (see that function's docstring, the image-scoping
          # fix's "SECOND real bug" section) deletes stray product_images
          # DB rows on a rescrape, but Al asked directly whether the
          # matching S3 objects (image_processor may have already
          # mirrored them) get cleaned up too -- they didn't, until this.
          # delete_orphaned_image_objects (called from _process_one) is
          # gated on this var being set, same optional/soft-fail
          # convention as IMAGE_PROCESS_QUEUE_URL above -- see that
          # function's docstring.
          IMAGE_BUCKET: !Ref ImageBucket
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref DbSecretArn
            # Narrower than ImageProcessorFunction's S3CrudPolicy (that
            # function actually writes the objects this one only ever
            # cleans up after a stale-row delete) -- ListBucket (for
            # delete_orphaned_image_objects' list_objects_v2 pagination,
            # a bucket-level permission) plus DeleteObject scoped to the
            # product-images/ prefix image_processor.upload_variants
            # actually writes under, nothing broader.
            - Effect: Allow
              Action:
                - s3:ListBucket
              Resource: !GetAtt ImageBucket.Arn
            - Effect: Allow
              Action:
                - s3:DeleteObject
              Resource: !Sub arn:aws:s3:::${ImageBucket}/product-images/*
        - SQSSendMessagePolicy:
            QueueName: !GetAtt ImageProcessQueue.QueueName
      Events:
        NetsuiteProductScrapeQueueTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt NetsuiteProductScrapeQueue.Arn
            BatchSize: 5
            FunctionResponseTypes:
              - ReportBatchItemFailures
      # SQS-triggered from NetsuiteProductScrapeQueue (populated by
      # NetsuiteUrlDiscoveryFunction, which sets "status" in the message
      # body -- see that module's docstring, status has no reliable
      # on-page source for MOTIV) -- also still accepts direct/manual
      # invocation with {"url": "...", "brand_id": "...", "status": "..."}.

  # --- YouTube content enrichment (search + transcript + Bedrock summary) ---
  #
  # New feature, added this session per explicit user request. Originally
  # two functions (discovery + a single summarizer that also fetched the
  # transcript); NOW THREE, after a "split the architecture" change made
  # once live smoke-testing showed VideoSummarizerFunction's transcript
  # fetches consistently failing when made from its VPC-attached Lambda's
  # NAT-gateway IP -- see VideoTranscriptFetcherFunction's module docstring
  # (in src/video_transcript_fetcher/app.py) for the full evidence trail.
  #
  # VideoDiscoveryFunction: manual/direct invoke only, like the
  # *UrlDiscoveryFunction pattern above but writing candidates straight to
  # product_videos instead of publishing scrape jobs -- there's no
  # "scraper" step here, a video candidate IS the row.
  #
  # VideoTranscriptFetcherFunction: SQS-triggered from VideoSummarizeQueue
  # (which only ever receives a message when an admin approves a candidate
  # via POST /video-candidates/{id}/approve -- see
  # src/admin_api/service.py's approve_video_candidate). Deliberately NOT
  # VPC-attached (no DB access needed -- youtube_video_id is passed in the
  # message itself) so it uses AWS's normal, shared execution network path
  # instead of this stack's single NAT gateway IP, a genuinely different
  # ordinary AWS network path rather than an attempt to disguise traffic
  # (no proxies/fingerprint spoofing -- same line this project holds for
  # Instagram/TikTok/etc.). Publishes its result to
  # VideoTranscriptResultQueue regardless of whether a transcript was
  # actually found -- "no transcript" is an expected, non-error outcome.
  #
  # VideoSummarizerFunction: SQS-triggered from VideoTranscriptResultQueue.
  # Still VPC-attached (needs DbSecretArn) and does the actual DB write +
  # Bedrock summarization call, but no longer talks to YouTube itself.
  #
  # All three require real credentials this project can't obtain on its
  # own: YouTubeApiKeySecretArn (a Google Cloud API key) and Bedrock model
  # access granted in the console for BedrockModelId -- see those
  # parameters' descriptions above.

  VideoDiscoveryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: bowling-scraper-video-discovery
      CodeUri: src/video_discovery/
      Handler: app.handler
      # Network-bound (one YouTube search.list call per product, each a
      # real HTTP round trip) -- same reasoning as the other discovery/
      # scraper functions' 150s, but raised to 280s after a real incident:
      # a live 90-product run hit YouTube's per-minute search.list rate
      # limit partway through (38/90 calls got a 429 "rateLimitExceeded"
      # -- see src/video_discovery/app.py's module docstring for the full
      # writeup and the retry-with-backoff fix). The extra headroom is for
      # the backoff waits get_youtube_requests_session's Retry config
      # introduces on whichever calls actually get throttled, not for the
      # normal per-request round trip time.
      Timeout: 280
      Environment:
        Variables:
          YOUTUBE_API_KEY_SECRET_ARN: !Ref YouTubeApiKeySecretArn
          # 70, not 90 -- lowered after REAL INCIDENT #3 (see app.py's
          # module docstring): the user confirmed in Google Cloud console
          # that this project's search.list quota is exactly 100/day, so
          # 90 was consuming nearly the entire daily budget in a single
          # invocation and leaving no real headroom for same-day retries.
          MAX_SEARCHES_PER_INVOCATION: "70"
          # 20 results/product (was 5) -- doesn't cost extra YouTube API
          # quota, that's per search.list *call* (one per product, still
          # capped by MAX_SEARCHES_PER_INVOCATION), not per result returned.
          # YouTube's own ceiling on this param is 50.
          MAX_RESULTS_PER_PRODUCT: "20"
          # Real incident #2 (see app.py's module docstring): a batch
          # that's sustained-throttled from the start can blow past even
          # this function's 280s Timeout, since retry-with-backoff cost
          # stacks per throttled product in the sequential loop. 5
          # consecutive 429s stops the invocation early with a clean
          # result instead of risking a hard Sandbox.Timedout kill.
          CIRCUIT_BREAKER_THRESHOLD: "5"
      Policies:
        - VPCAccessPolicy: {}
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref DbSecretArn
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              # Same "blank default isn't a valid IAM Resource" fix as
              # AdminApiTokenSecretArn/BigCommerceSecretArn above -- only
              # grant this once HasYouTubeApiKeySecret confirms a real ARN.
              Resource: !If
                - HasYouTubeApiKeySecret
                - !Ref YouTubeApiKeySecretArn
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:unused-*"
      # Manual/direct invoke only, same as the other discovery functions --
      # no schedule wired up. Invoke with {} (all published+current
      # products, capped), {"brand_id": "..."}, or {"product_ids": [...]}
      # -- see module docstring for the subset-first reasoning and the
      # real ~90-searches/day quota ceiling this respects.

  VideoTranscriptFetcherFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: bowling-scraper-video-transcript-fetcher
      CodeUri: src/video_transcript_fetcher/
      Handler: app.handler
      # Same 150s reasoning as VideoSummarizerFunction had before the split
      # -- a watch-page fetch plus up to DEFAULT_WATCH_PAGE_FETCH_ATTEMPTS
      # retries plus a transcript XML fetch is several sequential network
      # round trips, the same shape that drove every other 150s Timeout in
      # this template.
      Timeout: 150
      Environment:
        Variables:
          TRANSCRIPT_RESULT_QUEUE_URL: !Ref VideoTranscriptResultQueue
      # Deliberately NO VPCAccessPolicy and no DbSecretArn-reading policy --
      # this function never touches the database (see the module comment
      # block above and video_transcript_fetcher/app.py's own module
      # docstring for why that's the whole point of this split). Globals'
      # DB_SECRET_ARN environment variable still gets set on this function
      # like every other one in this template, but it's harmless: nothing
      # in app.py reads it or has IAM permission to use it.
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt VideoTranscriptResultQueue.QueueName
      Events:
        VideoSummarizeQueueTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt VideoSummarizeQueue.Arn
            BatchSize: 5
            FunctionResponseTypes:
              - ReportBatchItemFailures
      # SQS-triggered from VideoSummarizeQueue (populated only by an admin
      # approval, see above -- the queue's name predates this split and was
      # kept as-is to avoid a CloudFormation resource replacement) -- also
      # still accepts direct/manual invocation with {"product_video_id":
      # "...", "youtube_video_id": "..."} for testing one row by hand.

  VideoSummarizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: bowling-scraper-video-summarizer
      CodeUri: src/video_summarizer/
      Handler: app.handler
      Timeout: 150
      Environment:
        Variables:
          BEDROCK_MODEL_ID: !Ref BedrockModelId
      Policies:
        - VPCAccessPolicy: {}
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref DbSecretArn
            # Bedrock Global cross-Region inference needs THREE separate
            # resource grants, not one -- this is AWS's own documented
            # policy shape (see BedrockBaseModelId's parameter description
            # for the doc link), not something invented here. A single
            # "foundation-model/${BedrockModelId}" statement (what this
            # used to be, back when BedrockModelId was a bare on-demand
            # model id) would fail closed with AccessDeniedException at
            # invoke time against an inference-profile id, since neither
            # the profile resource itself nor the cross-Region foundation-
            # model resources it fans out to would be covered.
            - Sid: GrantGlobalCrisInferenceProfileRegionAccess
              Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockModelId}"
            - Sid: GrantGlobalCrisInferenceProfileInRegionModelAccess
              Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/${BedrockBaseModelId}"
              Condition:
                StringEquals:
                  bedrock:InferenceProfileArn: !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockModelId}"
            - Sid: GrantGlobalCrisInferenceProfileGlobalModelAccess
              Effect: Allow
              Action:
                - bedrock:InvokeModel
              # No Region or account in this ARN -- intentional, required
              # for Global CRIS's cross-Region routing (see AWS's doc: the
              # global foundation-model resource has no Region/account
              # component by design).
              Resource: !Sub "arn:aws:bedrock:::foundation-model/${BedrockBaseModelId}"
              Condition:
                StringEquals:
                  bedrock:InferenceProfileArn: !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockModelId}"
      Events:
        VideoTranscriptResultQueueTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt VideoTranscriptResultQueue.Arn
            BatchSize: 5
            FunctionResponseTypes:
              - ReportBatchItemFailures
      # SQS-triggered from VideoTranscriptResultQueue (populated by
      # VideoTranscriptFetcherFunction, which only ever runs after an admin
      # approval -- see above) -- also still accepts direct/manual
      # invocation with {"product_video_id": "...", "transcript": "...",
      # "transcript_note": "..."} for testing one row by hand.

  # --- commercebuild brand family (Storm, Roto Grip, 900 Global) ---
  #
  # A fourth platform, added this session -- see COMMERCEBUILD_SCOPING.md
  # and src/commercebuild_product_scraper/app.py's module docstring for
  # the full research trail. Unlike the three families above, one site
  # (stormbowling.com) serves all three brands through the same
  # commercebuild/XM Symphony template, so there's a single
  # UrlDiscoveryFunction and a single ProductScraperFunction here instead
  # of one pair per brand -- CommercebuildUrlDiscoveryFunction iterates
  # all three brands itself (10s apart, respecting stormbowling.com's
  # robots.txt Crawl-delay: 10) rather than being redeployed per brand
  # the way UrlDiscoveryFunction is for Brunswick/Radical/DV8.
  #
  # Current products only, same scope limit as the other three families'
  # initial builds -- archived/retired commercebuild products need a
  # different discovery mechanism (the archive listing's own links 404 on
  # a bare request, confirmed real and documented as an open risk in
  # COMMERCEBUILD_SCOPING.md) and aren't built yet.
  #
  # Not a PdfParseQueue trigger target, unlike the Craft-CMS family:
  # CommercebuildProductScraperFunction fetches and parses each product's
  # Tech Data PDF inline in the same invocation (see fetch_pdf/
  # parse_tech_data_pdf in app.py) rather than publishing a separate job,
  # same reasoning as WooCommerce/NetSuite not using PdfParseQueue either.
  #
  # KNOWN GAP, disclosed rather than silently ignored (same spirit as
  # MOTIV's unverified-fetch disclosure above): stormbowling.com's
  # Crawl-delay: 10 is respected by CommercebuildUrlDiscoveryFunction's
  # own inter-brand sleep, but CommercebuildProductScraperFunction has no
  # equivalent throttle on its own per-message fetches -- a burst of SQS
  # messages could hit the site faster than one request per 10s. Needs an
  # SQS event-source-mapping concurrency limit (e.g. a queue-level
  # MaximumConcurrency) once real message volume is observed; not added
  # here yet since BatchSize: 5 alone doesn't guarantee safe spacing.

  CommercebuildUrlDiscoveryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: bowling-scraper-commercebuild-url-discovery
      CodeUri: src/commercebuild_url_discovery/
      Handler: app.handler
      Environment:
        Variables:
          CATEGORY_URL: !Ref CommercebuildCategoryUrl
          SITEMAP_URL: !Ref CommercebuildSitemapUrl
          # Combines the three per-brand parameters into the single JSON
          # blob commercebuild_url_discovery/app.py's handler expects
          # (BRAND_IDS_JSON) -- keeps the established one-parameter-per-
          # brand convention (matching SwagBrandId/MotivBrandId) at the
          # template level even though one Lambda handles all three
          # brands, rather than changing already-tested app.py code to
          # read three separate env vars.
          BRAND_IDS_JSON: !Sub '{"storm":"${StormBrandId}","roto_grip":"${RotoGripBrandId}","global_900":"${Global900BrandId}"}'
          PRODUCT_SCRAPE_QUEUE_URL: !Ref CommercebuildProductScrapeQueue
      Policies:
        - VPCAccessPolicy: {}
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref DbSecretArn
        - SQSSendMessagePolicy:
            QueueName: !GetAtt CommercebuildProductScrapeQueue.QueueName
      # No schedule wired up yet, same reasoning as
      # WooCommerceUrlDiscoveryFunction/NetsuiteUrlDiscoveryFunction --
      # add once StormBrandId/RotoGripBrandId/Global900BrandId are
      # actually set for a real deployment.

  CommercebuildProductScraperFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: bowling-scraper-commercebuild-product-scraper
      CodeUri: src/commercebuild_product_scraper/
      Handler: app.handler
      # Real bug confirmed via production CloudWatch logs during the
      # archived-product smoke test: the same class of problem just fixed
      # on ImageProcessorFunction (see that Timeout's comment). This
      # function processes each SQS batch (BatchSize: 5) sequentially --
      # one page fetch + optional PDF fetch/parse per item -- and was
      # directly observed hitting a hard 30s timeout mid-batch (REPORT
      # line: "Duration: 30000.00 ms ... Status: timeout"), right after
      # successfully handling one item's real 404 and moving on to the
      # next. A hard timeout here kills the whole invocation with no
      # batchItemFailures reported, so the entire batch of 5 gets retried
      # rather than just the slow item. Raised to 150s, safely under
      # CommercebuildProductScrapeQueue's VisibilityTimeout: 180.
      Timeout: 150
      MemorySize: 512
      # Bumped from the 256 default -- pdfplumber's in-memory PDF parsing
      # (done inline here, see the comment block above) is heavier than
      # the plain-HTML parsing the other product scrapers do, same
      # reasoning as ImageProcessorFunction's bump to 512.
      Environment:
        Variables:
          IMAGE_PROCESS_QUEUE_URL: !Ref ImageProcessQueue
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref DbSecretArn
        - SQSSendMessagePolicy:
            QueueName: !GetAtt ImageProcessQueue.QueueName
      Events:
        CommercebuildProductScrapeQueueTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt CommercebuildProductScrapeQueue.Arn
            BatchSize: 5
            FunctionResponseTypes:
              - ReportBatchItemFailures
      # SQS-triggered from CommercebuildProductScrapeQueue (populated by
      # CommercebuildUrlDiscoveryFunction) -- also still accepts
      # direct/manual invocation with {"url": "...", "brand_id": "..."}.
      # Fans out to the SAME ImageProcessQueue/ImageProcessorFunction
      # every other family uses -- that function's job shape and
      # processing are platform-agnostic.

  # --- Shopify brand family (Hammer Bowling, Track, Ebonite) ---
  #
  # A fourth platform, added a prior session for Hammer -- see
  # HammerStoreDomain's Parameters description above and
  # src/shopify_url_discovery/app.py's module docstring for the real,
  # confirmed platform differences that drove this design. Track and
  # Ebonite (confirmed live this session) reuse the exact same
  # ShopifyUrlDiscoveryFunction CodeUri, one resource per brand, same
  # reuse convention as RadicalUrlDiscoveryFunction/Dv8UrlDiscoveryFunction
  # -- ShopifyProductScraperFunction below is a SINGLE shared function for
  # all three brands (brand-agnostic already: brand_id comes from each
  # SQS job's payload, not an env var -- see that function's own comment),
  # so only the discovery side needed new resources.
  #
  # All three discovery functions publish into the SAME
  # ShopifyProductScrapeQueue -- ShopifyProductScraperFunction consumes it
  # and fans out to the shared ImageProcessQueue for any new images. Not a
  # PdfParseQueue trigger target -- RG/DIFF/ASY are already in HTML on this
  # platform, same reasoning as WooCommerce/NetSuite.

  ShopifyUrlDiscoveryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: bowling-scraper-shopify-url-discovery
      CodeUri: src/shopify_url_discovery/
      Handler: app.handler
      Environment:
        Variables:
          STORE_DOMAIN: !Ref HammerStoreDomain
          COLLECTION_HANDLES: !Ref HammerCollectionHandles
          BRAND_ID: !Ref HammerBrandId
          PRODUCT_SCRAPE_QUEUE_URL: !Ref ShopifyProductScrapeQueue
      Policies:
        - VPCAccessPolicy: {}
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref DbSecretArn
        - SQSSendMessagePolicy:
            QueueName: !GetAtt ShopifyProductScrapeQueue.QueueName
      # No schedule wired up yet (unlike UrlDiscoveryFunction's daily
      # trigger) -- add once HammerBrandId is actually set for a real
      # deployment; a schedule referencing an empty BrandId isn't useful.
      # Same for TrackUrlDiscoveryFunction/EboniteUrlDiscoveryFunction
      # below.

  TrackUrlDiscoveryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: bowling-scraper-track-url-discovery
      CodeUri: src/shopify_url_discovery/
      Handler: app.handler
      Environment:
        Variables:
          STORE_DOMAIN: !Ref TrackStoreDomain
          COLLECTION_HANDLES: !Ref TrackCollectionHandles
          BRAND_ID: !Ref TrackBrandId
          PRODUCT_SCRAPE_QUEUE_URL: !Ref ShopifyProductScrapeQueue
      Policies:
        - VPCAccessPolicy: {}
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref DbSecretArn
        - SQSSendMessagePolicy:
            QueueName: !GetAtt ShopifyProductScrapeQueue.QueueName
      # Same CodeUri as ShopifyUrlDiscoveryFunction, different env vars --
      # see TrackStoreDomain/TrackCollectionHandles/TrackBrandId's
      # Parameters descriptions above for what's actually different about
      # Track vs. Hammer (collection-handle set, not the discovery logic
      # itself). No schedule wired up yet, same reasoning as Hammer's.

  EboniteUrlDiscoveryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: bowling-scraper-ebonite-url-discovery
      CodeUri: src/shopify_url_discovery/
      Handler: app.handler
      Environment:
        Variables:
          STORE_DOMAIN: !Ref EboniteStoreDomain
          COLLECTION_HANDLES: !Ref EboniteCollectionHandles
          BRAND_ID: !Ref EboniteBrandId
          PRODUCT_SCRAPE_QUEUE_URL: !Ref ShopifyProductScrapeQueue
      Policies:
        - VPCAccessPolicy: {}
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref DbSecretArn
        - SQSSendMessagePolicy:
            QueueName: !GetAtt ShopifyProductScrapeQueue.QueueName
      # Same CodeUri as ShopifyUrlDiscoveryFunction, different env vars --
      # see EboniteStoreDomain/EboniteCollectionHandles/EboniteBrandId's
      # Parameters descriptions above. No schedule wired up yet, same
      # reasoning as Hammer's.

  ShopifyProductScraperFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: bowling-scraper-shopify-product-scraper
      CodeUri: src/shopify_product_scraper/
      Handler: app.handler
      # Same reasoning as every other product scraper's raised timeout --
      # one product-page-plus-image-fanout per SQS batch item, sequential.
      Timeout: 150
      Environment:
        Variables:
          IMAGE_PROCESS_QUEUE_URL: !Ref ImageProcessQueue
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref DbSecretArn
        - SQSSendMessagePolicy:
            QueueName: !GetAtt ImageProcessQueue.QueueName
      Events:
        ShopifyProductScrapeQueueTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt ShopifyProductScrapeQueue.Arn
            BatchSize: 5
            FunctionResponseTypes:
              - ReportBatchItemFailures
      # SQS-triggered from ShopifyProductScrapeQueue (populated by
      # ShopifyUrlDiscoveryFunction) -- also still accepts direct/manual
      # invocation with {"url": "...", "brand_id": "..."}, including from
      # AdminApiFunction's queue_rescrape backfill path (see
      # SHOPIFY_PRODUCT_SCRAPE_QUEUE_URL below). Fans out to the SAME
      # ImageProcessQueue/ImageProcessorFunction every other family uses.

  # --- QA cross-checks: bowwwl.com and BowlerDepot reconciliation ---
  #
  # Both scheduled (not SQS-triggered like the scraping chain above) --
  # these work through a batch of already-scraped products rather than
  # reacting to new URLs, so a periodic sweep fits better than an
  # event-driven queue. See src/bowwwl_cross_check/app.py and
  # src/bowlerdepot_reconciliation/app.py module docstrings for the full
  # design/legal/unverified-mapping detail behind each.

  BowwwlCrossCheckFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: bowling-scraper-bowwwl-cross-check
      CodeUri: src/bowwwl_cross_check/
      Handler: app.handler
      Timeout: 120
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref DbSecretArn
      Events:
        WeeklySchedule:
          Type: Schedule
          Properties:
            # Weekly, not daily -- bowwwl.com's own Terms & Conditions
            # explicitly prohibit reproducing/redistributing their content
            # (see app.py's module docstring); a lighter check frequency
            # is a deliberate choice to keep load on their site modest,
            # independent of the legal question already raised and
            # accepted. Works through 25 products per run (see
            # list_products_to_check's default limit) oldest-checked-first,
            # so the whole catalog gets covered over consecutive runs
            # rather than all at once.
            Schedule: rate(7 days)
            Name: bowling-scraper-bowwwl-cross-check-weekly
            Description: QA cross-check against bowwwl.com for published current products, oldest-checked-first.
            Enabled: true
      # Also accepts a direct invocation with {"product_id": "...",
      # "brand_name": "...", "name": "...", "release_date": "..."} for a
      # single-product check.

  BowlerDepotReconciliationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: bowling-scraper-bowlerdepot-reconciliation
      CodeUri: src/bowlerdepot_reconciliation/
      Handler: app.handler
      Timeout: 300
      MemorySize: 512
      Environment:
        Variables:
          BIGCOMMERCE_SECRET_ARN: !Ref BigCommerceSecretArn
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              # BigCommerceSecretArn defaults to "" (see its parameter
              # description) until BowlerDepot reconciliation is actually
              # enabled -- an empty string isn't a valid IAM Resource value
              # ("must be in ARN format or *"), so it's only included here
              # once HasBigCommerceSecret confirms a real ARN was supplied.
              Resource: !If
                - HasBigCommerceSecret
                - - !Ref DbSecretArn
                  - !Ref BigCommerceSecretArn
                - - !Ref DbSecretArn
      Events:
        DailySchedule:
          Type: Schedule
          Properties:
            # Daily, not weekly -- this is our own store (see the "no ToS
            # concern" reasoning in app.py's module docstring), and the
            # whole point is catching a newly-scraped ball that isn't
            # listed yet "in a timely manner", so a tighter cadence than
            # bowwwl's fits the actual goal better.
            Schedule: rate(1 day)
            Name: bowling-scraper-bowlerdepot-reconciliation-daily
            Description: Coverage + accuracy check against BowlerDepot's BigCommerce catalog for every published current product.
            Enabled: true
      # Enabled: false on purpose, unlike BowwwlCrossCheckFunction's
      # schedule -- that one no-ops harmlessly with just DbSecretArn (no
      # matching products = an empty result, not an error), but this
      # function's very first line calls get_bigcommerce_credentials(),
      # which will hard-fail every single day against
      # BigCommerceSecretArn's default blank value. Flip this to true once
      # a real BowlerDepot store account/API token is wired up (see the
      # BigCommerceSecretArn parameter description) -- until then, a
      # disabled-but-defined schedule is more honest than one that's
      # "on" but guaranteed to error on every invocation.

