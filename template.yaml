          COLLECTION_HANDLES: !Ref HammerCollectionHandles
          BRAND_ID: !Ref HammerBrandId
          PRODUCT_SCRAPE_QUEUE_URL: !Ref ShopifyProductScrapeQueue
      Policies:
        - VPCAccessPolicy: {}
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref DbSecretArn
        - SQSSendMessagePolicy:
            QueueName: !GetAtt ShopifyProductScrapeQueue.QueueName
      Events:
        DailySchedule:
          Type: Schedule
          Properties:
            Schedule: rate(1 day)
            Name: bowling-scraper-hammer-url-discovery-daily
            Description: collections/*.json diff against discovered_urls for Hammer; emits new/changed product URLs.
            Enabled: true

  TrackUrlDiscoveryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: bowling-scraper-track-url-discovery
      CodeUri: src/shopify_url_discovery/
      Handler: app.handler
      Environment:
        Variables:
          STORE_DOMAIN: !Ref TrackStoreDomain
          COLLECTION_HANDLES: !Ref TrackCollectionHandles
          BRAND_ID: !Ref TrackBrandId
          PRODUCT_SCRAPE_QUEUE_URL: !Ref ShopifyProductScrapeQueue
      Policies:
        - VPCAccessPolicy: {}
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref DbSecretArn
        - SQSSendMessagePolicy:
            QueueName: !GetAtt ShopifyProductScrapeQueue.QueueName
      # Same CodeUri as ShopifyUrlDiscoveryFunction, different env vars --
      # see TrackStoreDomain/TrackCollectionHandles/TrackBrandId's
      # Parameters descriptions above for what's actually different about
      # Track vs. Hammer (collection-handle set, not the discovery logic
      # itself).
      Events:
        DailySchedule:
          Type: Schedule
          Properties:
            Schedule: rate(1 day)
            Name: bowling-scraper-track-url-discovery-daily
            Description: collections/*.json diff against discovered_urls for Track; emits new/changed product URLs.
            Enabled: true

  EboniteUrlDiscoveryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: bowling-scraper-ebonite-url-discovery
      CodeUri: src/shopify_url_discovery/
      Handler: app.handler
      Environment:
        Variables:
          STORE_DOMAIN: !Ref EboniteStoreDomain
          COLLECTION_HANDLES: !Ref EboniteCollectionHandles
          BRAND_ID: !Ref EboniteBrandId
          PRODUCT_SCRAPE_QUEUE_URL: !Ref ShopifyProductScrapeQueue
      Policies:
        - VPCAccessPolicy: {}
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref DbSecretArn
        - SQSSendMessagePolicy:
            QueueName: !GetAtt ShopifyProductScrapeQueue.QueueName
      # Same CodeUri as ShopifyUrlDiscoveryFunction, different env vars --
      # see EboniteStoreDomain/EboniteCollectionHandles/EboniteBrandId's
      # Parameters descriptions above.
      Events:
        DailySchedule:
          Type: Schedule
          Properties:
            Schedule: rate(1 day)
            Name: bowling-scraper-ebonite-url-discovery-daily
            Description: collections/*.json diff against discovered_urls for Ebonite; emits new/changed product URLs.
            Enabled: true

  ShopifyProductScraperFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: bowling-scraper-shopify-product-scraper
      CodeUri: src/shopify_product_scraper/
      Handler: app.handler
      # Same reasoning as every other product scraper's raised timeout --
      # one product-page-plus-image-fanout per SQS batch item, sequential.
      Timeout: 150
      Environment:
        Variables:
          IMAGE_PROCESS_QUEUE_URL: !Ref ImageProcessQueue
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref DbSecretArn
        - SQSSendMessagePolicy:
            QueueName: !GetAtt ImageProcessQueue.QueueName
      Events:
        ShopifyProductScrapeQueueTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt ShopifyProductScrapeQueue.Arn
            BatchSize: 5
            FunctionResponseTypes:
              - ReportBatchItemFailures
      # SQS-triggered from ShopifyProductScrapeQueue (populated by
      # ShopifyUrlDiscoveryFunction) -- also still accepts direct/manual
      # invocation with {"url": "...", "brand_id": "..."}, including from
      # AdminApiFunction's queue_rescrape backfill path (see
      # SHOPIFY_PRODUCT_SCRAPE_QUEUE_URL below). Fans out to the SAME
      # ImageProcessQueue/ImageProcessorFunction every other family uses.

  # --- QA cross-checks: bowwwl.com and BowlerDepot reconciliation ---
  #
  # Both scheduled (not SQS-triggered like the scraping chain above) --
  # these work through a batch of already-scraped products rather than
  # reacting to new URLs, so a periodic sweep fits better than an
  # event-driven queue. See src/bowwwl_cross_check/app.py and
  # src/bowlerdepot_reconciliation/app.py module docstrings for the full
  # design/legal/unverified-mapping detail behind each.

  BowwwlCrossCheckFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: bowling-scraper-bowwwl-cross-check
      CodeUri: src/bowwwl_cross_check/
      Handler: app.handler
      Timeout: 120
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref DbSecretArn
      Events:
        WeeklySchedule:
          Type: Schedule
          Properties:
            # Weekly, not daily -- bowwwl.com's own Terms & Conditions
            # explicitly prohibit reproducing/redistributing their content
            # (see app.py's module docstring); a lighter check frequency
            # is a deliberate choice to keep load on their site modest,
            # independent of the legal question already raised and
            # accepted. Works through 25 products per run (see
            # list_products_to_check's default limit) oldest-checked-first,
            # so the whole catalog gets covered over consecutive runs
            # rather than all at once.
            Schedule: rate(7 days)
            Name: bowling-scraper-bowwwl-cross-check-weekly
            Description: QA cross-check against bowwwl.com for published current products, oldest-checked-first.
            Enabled: true
      # Also accepts a direct invocation with {"product_id": "...",
      # "brand_name": "...", "name": "...", "release_date": "..."} for a
      # single-product check.

  BowlerDepotReconciliationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: bowling-scraper-bowlerdepot-reconciliation
      CodeUri: src/bowlerdepot_reconciliation/
      Handler: app.handler
      Timeout: 300
      MemorySize: 512
      Environment:
        Variables:
          BIGCOMMERCE_SECRET_ARN: !Ref BigCommerceSecretArn
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              # BigCommerceSecretArn defaults to "" (see its parameter
              # description) until BowlerDepot reconciliation is actually
              # enabled -- an empty string isn't a valid IAM Resource value
              # ("must be in ARN format or *"), so it's only included here
              # once HasBigCommerceSecret confirms a real ARN was supplied.
              Resource: !If
                - HasBigCommerceSecret
                - - !Ref DbSecretArn
                  - !Ref BigCommerceSecretArn
                - - !Ref DbSecretArn
      Events:
        DailySchedule:
          Type: Schedule
          Properties:
            # Daily, not weekly -- this is our own store (see the "no ToS
            # concern" reasoning in app.py's module docstring), and the
            # whole point is catching a newly-scraped ball that isn't
            # listed yet "in a timely manner", so a tighter cadence than
            # bowwwl's fits the actual goal better.
            Schedule: rate(1 day)
            Name: bowling-scraper-bowlerdepot-reconciliation-daily
            Description: Coverage + accuracy check against BowlerDepot's BigCommerce catalog for every published current product.
            Enabled: true
      # Enabled: true assumes a real BigCommerceSecretArn is supplied at
      # deploy time (see that parameter's description) -- unlike
      # BowwwlCrossCheckFunction's schedule, which no-ops harmlessly with
      # just DbSecretArn (no matching products = an empty result, not an
      # error), this function's very first line calls
      # get_bigcommerce_credentials(), which will hard-fail every single
      # day if BigCommerceSecretArn is left at its default blank value
      # (the IAM grant above is conditional on HasBigCommerceSecret too,
      # so a blank ARN means the Lambda can't even read the secret it's
      # trying to fetch). A real store_hash/auth_token secret + ARN now
      # exist for this deployment (see DEPLOY_RUNBOOK.md step 3) -- if
      # you're deploying without one, flip this back to false rather than
      # leave a schedule that's guaranteed to error on every invocation.

  # --- Price tracking (migration 014/015) ---
  #
  # New feature, Al: "id like to start a price tracker. this should be
  # configurable to have site setup so that it will pull the current
  # price from a number of sites on a frequency of likely daily?"
  # Corrected mid-build to auto-search/match (mirroring video_discovery's
  # YouTube search) with a pending-review gate (Al: "the reccomended
  # path is best") rather than manual URL entry -- see src/price_checker/
  # app.py's module docstring for the full design. PriceCheckerFunction
  # itself is still the only new compute resource this feature needs --
  # unlike the video pipeline (VideoDiscoveryFunction + VideoSummarizer-
  # Function + VideoTranscriptFetcherFunction, three separate Lambdas),
  # ONE Lambda handles both the {"discover": true, ...} search job shape
  # and the checking job shape, dispatched by handler() on the event
  # payload -- there's still no queue in front of it (same invoke-
  # directly shape as VideoDiscoveryFunction, see AdminApiFunction's
  # PRICE_CHECKER_FUNCTION_NAME/lambda:InvokeFunction grant above, which
  # already covers both job shapes since they're the same function ARN).
  PriceCheckerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: bowling-scraper-price-checker
      CodeUri: src/price_checker/
      Handler: app.handler
      # Network-bound against arbitrary, unpredictably slow third-party
      # sites (not a single well-behaved API the way YouTube's Data API
      # is) -- 280s matches VideoDiscoveryFunction's own timeout for the
      # same "real HTTP round trips in a sequential loop" reasoning, even
      # though this function's own retry tuning is lighter (see app.py's
      # module docstring: no confirmed rate-limit incident to size
      # against here, just a bound on one invocation's wall-clock time).
      # Sized for the checking job shape's own per-invocation loop (one
      # HTTP fetch per approved source); the discovery job shape's loop
      # is one HTTP fetch per product PER active site, so a very large
      # discovery batch could still need more headroom than this if the
      # configured site count grows well past a handful -- not a
      # concern yet with the few named retailers (bowling.com,
      # bowlingball.com, bowlersmart.com, ...) this feature launches
      # with, but worth revisiting if that list grows a lot.
      Timeout: 280
      # BIGCOMMERCE_SECRET_ARN (016_price_tracking_bigcommerce.sql /
      # get_bigcommerce_credentials) -- same secret BowlerDepotReconciliation-
      # Function already reads, reused here rather than duplicated, since
      # both functions are hitting the same BowlerDepot BigCommerce store.
      # A real store_hash/auth_token secret + ARN now exist for this
      # deployment (see DEPLOY_RUNBOOK.md step 3) -- see that parameter's
      # own description if deploying somewhere that doesn't have one yet.
      # Unlike BowlerDepotReconciliationFunction, this function's daily
      # schedule doesn't hard-fail without real credentials even when
      # BigCommerceSecretArn IS left blank: check_bigcommerce_sources/
      # discover_bigcommerce_candidates only ever run against
      # 'api'-fetch_method price_sites rows, and none exist until an
      # admin creates one (same as any other price_sites row) -- so
      # PriceCheckerFunction's own schedule stays safely Enabled: true
      # either way, scrape-only until both a real secret AND an 'api'
      # price_sites row exist.
      Environment:
        Variables:
          BIGCOMMERCE_SECRET_ARN: !Ref BigCommerceSecretArn
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              # Same HasBigCommerceSecret conditional as
              # BowlerDepotReconciliationFunction's own grant above -- an
              # empty-string BigCommerceSecretArn isn't a valid IAM
              # Resource value, so it's only included once a real ARN is
              # supplied.
              Resource: !If
                - HasBigCommerceSecret
                - - !Ref DbSecretArn
                  - !Ref BigCommerceSecretArn
                - - !Ref DbSecretArn
      # Daily, per Al's own "likely daily?" -- checks up to price_checker.
      # DEFAULT_PRICE_CHECK_LIMIT (200) of the most-overdue APPROVED+
      # active price sources (see list_price_sources_due's ROTATION
      # reasoning), same never-checked-first/least-recently-checked-next
      # ordering VideoDiscoveryFunction's DailyStatsRefresh already
      # established for the same "no schedule -> the daily job never
      # actually progresses" reason. No explicit Input (unlike
      # DailyStatsRefresh's {"refresh_stats": true, "limit": 1000}) -- an
      # empty/default event is already handler's own checking-batch job
      # shape (see app.py's module docstring's CHECKING section), so
      # there's nothing to pass.
      #
      # Deliberately NO schedule here for the {"discover": true, ...} job
      # shape -- same "manual/direct invoke only" convention video_
      # discovery's own search flow uses (see that module's own
      # docstring), triggered via POST /products/{id}/discover-price-
      # sources or POST /admin/discover-all-price-sources (service.
      # queue_price_discovery/queue_price_discovery_batch) instead. An
      # admin decides when to widen the catalog's price-source coverage;
      # it doesn't need to run on its own daily cadence the way checking
      # already-approved sources does.
      Events:
        DailyPriceCheck:
          Type: Schedule
          Properties:
            Schedule: rate(1 day)
            Name: bowling-scraper-price-checker-daily
            Description: Checks price for the most-overdue approved+active product_price_sources rows (see list_price_sources_due).
            Enabled: true

  RefreshProductScoresFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: bowling-scraper-refresh-product-scores
      CodeUri: src/refresh_product_scores/
      Handler: app.handler
      # Three plain set-based UPDATEs against however many rows `products`
      # has -- see app.py's own module docstring for why this doesn't
      # carry the same per-invocation timeout risk product_article_
      # generator's LLM/image-generation loop does. 120s matches
      # BowwwlCrossCheckFunction's own moderate default; revisit only if
      # a real invocation ever approaches it (see app.py's docstring).
      Timeout: 120
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref DbSecretArn
      # Daily -- matches the actual freshness ceiling of the data these
      # scores are derived from: PriceCheckerFunction (SKU stock, feeds
      # total_daily_movement) and VideoDiscoveryFunction's own
      # DailyStatsRefresh (view counts, feeds popularity_score) both
      # already run rate(1 day) -- see 030_materialized_product_scores.
      # sql's own header comment. No explicit ordering against either of
      # those schedules (EventBridge rate() schedules aren't sequenced
      # against each other in this template, same as every other daily
      # job here) -- a run that lands slightly before that day's price/
      # stats refresh just reflects yesterday's numbers for one more day,
      # not a correctness bug.
      Events:
        DailyScoreRefresh:
          Type: Schedule
          Properties:
            Schedule: rate(1 day)
            Name: bowling-scraper-refresh-product-scores-daily
            Description: Recomputes products.popularity_score/total_daily_movement/demand_score for every product (030_materialized_product_scores.sql).
            Enabled: true
      # Also accepts a direct/manual invocation with {} (no job-shape
      # branching -- see app.py's own handler docstring) -- useful for a
      # one-time run right after this feature first deploys, so the new
      # columns don't sit at their default 0 for up to a full day before
      # the first scheduled run.

  BowlerdepotVideoSyncFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: bowling-scraper-bowlerdepot-video-sync
      CodeUri: src/bowlerdepot_video_sync/
      Handler: app.handler
      # Same 30s-per-request BigCommerce POST as price_checker's own
      # fetches, but no per-source retry loop here, and expected batch
      # volume (newly-approved videos catalog-wide since the last run) is
      # small -- 120s is generous headroom, not sized against a confirmed
      # incident the way PriceCheckerFunction's 280s was.
      Timeout: 120
      # BIGCOMMERCE_SECRET_ARN -- same secret PriceCheckerFunction/
      # BowlerDepotReconciliationFunction already read, reused here (see
      # BigCommerceSecretArn's own parameter description). Unlike those
      # two, THIS function's POST calls need the token to actually carry
      # the Products "modify" OAuth scope, not just read-only -- see
      # get_bigcommerce_credentials' docstring in app.py. If the existing
      # token predates this feature and was only ever granted read-only
      # access, every push will 403 until Al upgrades it (or issues a
      # second token) in BigCommerce's API Accounts settings -- nothing
      # in this template can detect or fix that for him.
      Environment:
        Variables:
          BIGCOMMERCE_SECRET_ARN: !Ref BigCommerceSecretArn
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              # Same HasBigCommerceSecret conditional as
              # PriceCheckerFunction/BowlerDepotReconciliationFunction's
              # own grants above -- an empty-string BigCommerceSecretArn
              # isn't a valid IAM Resource value.
              Resource: !If
                - HasBigCommerceSecret
                - - !Ref DbSecretArn
                  - !Ref BigCommerceSecretArn
                - - !Ref DbSecretArn
      # Hourly rather than daily -- Al's ask was specifically about a
      # video showing up on the storefront promptly once approved in the
      # admin review queue, not once a day. list_videos_needing_sync's
      # own query is cheap (only ever-outstanding rows), so an hourly
      # cadence costs nothing extra when there's nothing due, same
      # reasoning as this project's other frequent-poll schedules.
      Events:
        HourlySync:
          Type: Schedule
          Properties:
            Schedule: rate(1 hour)
            Name: bowling-scraper-bowlerdepot-video-sync-hourly
            Description: Pushes newly-approved, summarized videos for matched BowlerDepot products into BigCommerce's native Product Videos feature.
            Enabled: true

  BowlerdepotArticleSyncFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: bowling-scraper-bowlerdepot-article-sync
      CodeUri: src/bowlerdepot_article_sync/
      Handler: app.handler
      # Same reasoning as BowlerdepotVideoSyncFunction's own Timeout
      # comment: one extra BigCommerce GET (product URL lookup) plus one
      # POST (create blog post) per outstanding article, expected batch
      # volume is small (newly-flagged articles catalog-wide since the
      # last run) -- 120s is generous headroom, not sized against a
      # confirmed incident.
      Timeout: 120
      # BIGCOMMERCE_SECRET_ARN -- same secret every other BowlerDepot-
      # facing function reads. This function's Blog Post writes need the
      # token to carry the Content "modify" scope (store_v2_content) --
      # a DIFFERENT scope than BowlerdepotVideoSyncFunction's Products-
      # modify need -- see get_bigcommerce_credentials' docstring in
      # app.py. If the existing token doesn't have it, every push will
      # 403 until Al adds it in BigCommerce's own API Accounts settings;
      # nothing in this template can detect or fix that for him.
      Environment:
        Variables:
          BIGCOMMERCE_SECRET_ARN: !Ref BigCommerceSecretArn
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              # Same HasBigCommerceSecret conditional as
              # BowlerdepotVideoSyncFunction's own grant above.
              Resource: !If
                - HasBigCommerceSecret
                - - !Ref DbSecretArn
                  - !Ref BigCommerceSecretArn
                - - !Ref DbSecretArn
      # Hourly, same cadence as BowlerdepotVideoSyncFunction -- an admin
      # flipping the sync_to_bigcommerce flag on shouldn't have to wait a
      # full day to see it land. The Articles tab's "Sync now" button
      # (admin_api's queue_article_sync, see AdminApiFunction's
      # ARTICLE_SYNC_FUNCTION_NAME env var below) covers the "I want this
      # one NOW, not on the next hourly tick" case without needing a
      # tighter schedule here.
      Events:
        HourlySync:
          Type: Schedule
          Properties:
            Schedule: rate(1 hour)
            Name: bowling-scraper-bowlerdepot-article-sync-hourly
            Description: Pushes approved, admin-flagged ball-review articles for matched BowlerDepot products into BigCommerce's native Blog as new posts.
            Enabled: true

  # --- Consumer site static hosting (consumer-site/, the React SPA) ---
  #
  # Private S3 bucket + CloudFront in front of it via Origin Access
  # Control (OAC, the current-recommended approach -- not the older
  # OAI), unlike ImageBucket above which is deliberately public-read for
  # direct S3 URLs. The SPA itself needs HTTPS + a CDN in front of it
  # (browsers won't run a real site off a bare S3 website endpoint
  # cleanly, and CloudFront gives free HTTPS + caching + eventually a
  # custom domain), so this one goes through CloudFront from the start
  # rather than being public-read S3 like the images bucket.
  ConsumerSiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub bowling-scraper-consumer-site-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  ConsumerSiteOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub bowling-scraper-consumer-site-oac-${AWS::AccountId}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  ConsumerSiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        HttpVersion: http2
        # Both blank by default -- the distribution is perfectly usable at
        # its default *.cloudfront.net domain with no custom domain set up
        # at all (see ConsumerSiteDomainName/ConsumerSiteCertificateArn's
        # own descriptions above). CloudFront rejects Aliases without a
        # matching non-default ViewerCertificate, so these two conditions
        # are wired together on purpose, not independently.
        Aliases: !If
          - HasConsumerSiteDomain
          - - !Ref ConsumerSiteDomainName
          - !Ref AWS::NoValue
        ViewerCertificate: !If
          - HasConsumerSiteDomain
          - AcmCertificateArn: !Ref ConsumerSiteCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: ConsumerSiteBucketOrigin
            DomainName: !GetAtt ConsumerSiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt ConsumerSiteOAC.Id
            # No OriginAccessIdentity block -- that's the legacy OAI
            # mechanism, superseded here by OriginAccessControlId above.
            # S3OriginConfig with an empty OriginAccessIdentity is still
            # the required shape CloudFront expects even when using OAC.
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: ConsumerSiteBucketOrigin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          # Managed-CachingOptimized -- AWS's own recommended cache
          # policy id for static site assets, avoids hand-rolling TTL/
          # cache-key config for a straightforward SPA build.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        # SPA client-side routing fallback -- a direct load of e.g.
        # /balls/<id> or /compare has no matching object in the bucket
        # (only index.html/assets/* exist), so S3 (behind CloudFront)
        # returns 403 (no ListBucket permission) or 404. Both get
        # rewritten to index.html with a 200 so react-router's own route
        # table takes over client-side instead of the visitor seeing a
        # raw S3 error page.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

  ConsumerSiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ConsumerSiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub arn:aws:s3:::${ConsumerSiteBucket}/*
            # Scoped to THIS distribution specifically -- without this
            # condition any CloudFront distribution in the account could
            # read the bucket, not just this one.
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${ConsumerSiteDistribution}

  # --- Learn section hosting (learn.bowlerdepot.com) ---------------------
  #
  # Al's Learn-section pivot: "bigcommerce is just not the place [for
  # articles]... how do we best create a user experience that is not
  # disjointed" -- resolved via AskUserQuestion to a branded subdomain
  # ("Branded subdomain (Recommended)", not a path under the main
  # bowlerdepot.com domain, to avoid any risk to the live storefront's own
  # cart/checkout/session cookies) with the existing BigCommerce blog sync
  # (bowlerdepot_article_sync) kept running in parallel, unchanged ("Keep
  # both in parallel as-is"). Same S3 + CloudFront + OAC shape as
  # ConsumerSiteBucket/Distribution above -- deliberately a SEPARATE
  # bucket/distribution/deploy role, not a second path on the same one,
  # so the two sites (different domains, different repos' worth of static
  # assets, different deploy cadence) stay fully independent.
  LearnSiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub bowling-scraper-learn-site-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  LearnSiteOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub bowling-scraper-learn-site-oac-${AWS::AccountId}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Viewer-request URL rewrite for bowlerdepot-learn/scripts/prerender.ts's
  # (task #440) prerendered article pages -- see that script's own header
  # comment for the full "why" (SEO: a crawler needs real HTML at the
  # SAME url a visitor navigates to, /articles/<id>, not just at /articles/
  # <id>/index.html). CloudFront's S3-via-OAC origin (unlike the separate
  # "S3 static website hosting" mode) does NOT auto-append index.html to a
  # directory-shaped request -- this function is what makes that work:
  # a request whose last path segment has no "." (i.e. isn't already a
  # real asset like main.js/logo.png/sitemap.xml) gets index.html appended
  # before the origin fetch. A path with no prerendered page at that
  # location 403/404s from S3 exactly like today, which
  # CustomErrorResponses below still catches and rewrites to the SPA
  # shell -- this function only ever ADDS a suffix, it can't hide a page
  # that doesn't otherwise 404.
  LearnSitePrettyUrlFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub bowling-scraper-learn-pretty-url-${AWS::AccountId}
      FunctionConfig:
        Comment: Append /index.html to directory-shaped requests (prerendered article pages + SPA root)
        Runtime: cloudfront-js-2.0
      AutoPublish: true
      FunctionCode: |
        function handler(event) {
            var request = event.request;
            var uri = request.uri;

            // Already a real asset request (hashed JS/CSS, images,
            // /robots.txt, /sitemap.xml, ...) -- leave it alone.
            if (!uri.endsWith('/') && uri.includes('.')) {
                return request;
            }

            request.uri = uri.endsWith('/') ? uri + 'index.html' : uri + '/index.html';
            return request;
        }

  LearnSiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        HttpVersion: http2
        Aliases: !If
          - HasLearnSiteDomain
          - - !Ref LearnSiteDomainName
          - !Ref AWS::NoValue
        ViewerCertificate: !If
          - HasLearnSiteDomain
          - AcmCertificateArn: !Ref LearnSiteCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: LearnSiteBucketOrigin
            DomainName: !GetAtt LearnSiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt LearnSiteOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: LearnSiteBucketOrigin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt LearnSitePrettyUrlFunction.FunctionARN
        # SPA client-side routing fallback for any route with no
        # prerendered page at that path (see LearnSitePrettyUrlFunction's
        # own comment) -- same rewrite-to-200 shape as
        # ConsumerSiteDistribution above.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

  LearnSiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref LearnSiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub arn:aws:s3:::${LearnSiteBucket}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${LearnSiteDistribution}

  # Same OIDC-federation deploy role shape as ConsumerSiteDeployRole below
  # (see that resource's own extensive comments for the full "why OIDC
  # over long-lived keys" + the real GitHub-immutable-ID-suffix incident
  # that shaped the StringLike condition) -- reuses the SAME GitHubRepo
  # param and the account's one GitHubOidcProvider (defined further down,
  # conditionally, alongside ConsumerSiteDeployRole) rather than standing
  # up a second provider, since an AWS account can only have one OIDC
  # provider per URL.
  LearnSiteDeployRole:
    Type: AWS::IAM::Role
    Condition: HasGitHubRepo
    Properties:
      RoleName: !Sub bowling-scraper-learn-site-deploy-${AWS::AccountId}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  !Sub
                  - "repo:${Owner}*/${Repo}*:ref:refs/heads/main"
                  - Owner: !Select [0, !Split ["/", !Ref GitHubRepo]]
                    Repo: !Select [1, !Split ["/", !Ref GitHubRepo]]
      Policies:
        - PolicyName: learn-site-deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !GetAtt LearnSiteBucket.Arn
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub arn:aws:s3:::${LearnSiteBucket}/*
              - Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                Resource: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${LearnSiteDistribution}

  # --- Admin SPA hosting (task #465-473) ----------------------------------
  #
  # Al: "can we build a more sophisticated admin spa that is hosted on aws
  # and has users and an improved UI" -- same S3 + OAC + CloudFront shape
  # as ConsumerSiteBucket/LearnSiteBucket above, again a fully separate
  # bucket/distribution/deploy role rather than a second path on an
  # existing one (different repo directory, different deploy cadence,
  # and critically a DIFFERENT AUDIENCE -- this one sits behind Cognito
  # login, unlike the two public-facing sites). No pretty-url CloudFront
  # Function like LearnSitePrettyUrlFunction -- admin-spa/ has no
  # prerendered pages to route around, it's a plain client-rendered SPA,
  # so the same CustomErrorResponses 403/404->200 rewrite ConsumerSite
  # already uses is sufficient on its own.
  AdminSiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub bowling-scraper-admin-site-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  AdminSiteOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub bowling-scraper-admin-site-oac-${AWS::AccountId}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  AdminSiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        HttpVersion: http2
        Aliases: !If
          - HasAdminSiteDomain
          - - !Ref AdminSiteDomainName
          - !Ref AWS::NoValue
        ViewerCertificate: !If
          - HasAdminSiteDomain
          - AcmCertificateArn: !Ref AdminSiteCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: AdminSiteBucketOrigin
            DomainName: !GetAtt AdminSiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt AdminSiteOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: AdminSiteBucketOrigin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        # SPA client-side routing fallback -- react-router's routes (e.g.
        # /products, /dashboard) have no matching S3 object, same
        # reasoning as ConsumerSiteDistribution's own identical block.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

  AdminSiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AdminSiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub arn:aws:s3:::${AdminSiteBucket}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${AdminSiteDistribution}

  # Same OIDC-federation deploy role shape as ConsumerSiteDeployRole/
  # LearnSiteDeployRole -- reuses the same GitHubRepo param and the
  # account's one GitHubOidcProvider (defined below).
  AdminSiteDeployRole:
    Type: AWS::IAM::Role
    Condition: HasGitHubRepo
    Properties:
      RoleName: !Sub bowling-scraper-admin-site-deploy-${AWS::AccountId}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  !Sub
                  - "repo:${Owner}*/${Repo}*:ref:refs/heads/main"
                  - Owner: !Select [0, !Split ["/", !Ref GitHubRepo]]
                    Repo: !Select [1, !Split ["/", !Ref GitHubRepo]]
      Policies:
        - PolicyName: admin-site-deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !GetAtt AdminSiteBucket.Arn
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub arn:aws:s3:::${AdminSiteBucket}/*
              - Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                Resource: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${AdminSiteDistribution}

  # --- GitHub Actions CI/CD for the consumer site -----------------------
  #
  # Al: "lets get back to the CI for the consumer-site" -- push-to-deploy
  # for consumer-site/ via GitHub Actions. Chose OIDC federation over a
  # long-lived IAM access key pair stored as a GitHub secret: no AWS
  # credential ever leaves AWS, GitHub's own short-lived token is what gets
  # exchanged for temporary credentials scoped to exactly this role, and
  # there's nothing to rotate if a secret ever leaked (there isn't one).
  # See DEPLOY_RUNBOOK.md's CI section for the full one-time setup this
  # pairs with (the actual .github/workflows/deploy-consumer-site.yml, and
  # the GitHub repo Variables it needs). NOTE: this same GitHubOidcProvider
  # is also what LearnSiteDeployRole above trusts -- only ONE provider
  # resource for the whole account, shared by both sites' deploy roles.
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateGitHubOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      # No ThumbprintList -- optional as of the current AWS::IAM::OIDCProvider
      # spec. AWS verifies the IdP's TLS certificate against its own trusted
      # root CA store now (GitHub's cert chains up to one), only falling back
      # to thumbprint comparison if that verification isn't possible -- see
      # https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_providers_create_oidc.html.
      # Confirmed via that same page: IAM auto-fetches the thumbprint itself
      # when this property is omitted.

  ConsumerSiteDeployRole:
    Type: AWS::IAM::Role
    Condition: HasGitHubRepo
    Properties:
      RoleName: !Sub bowling-scraper-consumer-site-deploy-${AWS::AccountId}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              # Computed directly from AWS::AccountId rather than !GetAtt/
              # !Ref'd off GitHubOidcProvider above -- that resource is
              # itself conditional (ShouldCreateGitHubOidcProvider), and
              # this role has to work identically whether THIS stack
              # created the account's one GitHub OIDC provider or a
              # different stack already did (see CreateGitHubOidcProvider's
              # own parameter description). The ARN shape is deterministic
              # either way.
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              # Restricted to pushes on main specifically (not "any branch",
              # not "any PR") -- a fork's PR workflow run carries a
              # different sub claim shape and would already be rejected by
              # this, but being explicit about the exact ref is the actual
              # security boundary here, not an accident of the claim
              # format. workflow_dispatch (manual trigger) on main also
              # satisfies this same sub claim, so that stays usable too.
              #
              # Real incident: an exact repo:OWNER/REPO:ref:refs/heads/main
              # match rejected every run with "Not authorized to perform
              # sts:AssumeRoleWithWebIdentity", confirmed (via a debug step
              # decoding the actual token) to be because GitHub now appends
              # each owner/repo's numeric "immutable ID" to its name in the
              # sub claim -- e.g. awbowlerdepot@68925487/ballscratcher@
              # 1316941668, not just awbowlerdepot/ballscratcher (a GitHub
              # security hardening: prevents a renamed/transferred/deleted-
              # and-recreated repo from inheriting a stale trust policy
              # written against the old name). Wildcarding right after the
              # owner and repo names -- not the whole GitHubRepo value, the
              # "@id" lands *inside* it, before the "/" -- matches whether
              # or not that suffix is present, so this keeps working if
              # GitHub ever changes the default back, and doesn't hardcode
              # this repo's specific numeric IDs.
              StringLike:
                token.actions.githubusercontent.com:sub:
                  !Sub
                  - "repo:${Owner}*/${Repo}*:ref:refs/heads/main"
                  - Owner: !Select [0, !Split ["/", !Ref GitHubRepo]]
                    Repo: !Select [1, !Split ["/", !Ref GitHubRepo]]
      # Least-privilege, scoped to exactly what deploy-consumer-site.yml's
      # two real steps need -- nothing broader like sam deploy/
      # cloudformation:* here on purpose. A separate, human-run deploy
      # (see this section's own Build/Deploy steps above) is still how
      # template.yaml itself gets deployed; this role only ever touches
      # the already-provisioned ConsumerSiteBucket/Distribution.
      Policies:
        - PolicyName: consumer-site-deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !GetAtt ConsumerSiteBucket.Arn
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                # aws s3 sync --delete needs both: PutObject for new/
                # changed files, DeleteObject for ones removed from
                # dist/ since the last deploy.
                Resource: !Sub arn:aws:s3:::${ConsumerSiteBucket}/*
              - Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                Resource: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${ConsumerSiteDistribution}

